// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [gs,setGs]               = useState('menu');
  const [player,setPlayer]       = useState(null);
  const [dungeon,setDungeon]     = useState({floor:1,area:1,pos:{x:0,y:0},grid:[],w:3,h:3});
  const [encounter,setEncounter] = useState(null);
  const [logs,setLogs]           = useState([]);
  const [isPlayerTurn,setIsPlayerTurn] = useState(true);
  const [diceRoll,setDiceRoll]   = useState(null);
  const [pendingAttack,setPendingAttack] = useState(null); 
  const [lootQueue,setLootQueue] = useState([]);
  const [postLoot,setPostLoot]   = useState('exploring');
  const [screenAnim,setScreenAnim] = useState(false);

  const [roomReveal,setRoomReveal]     = useState(null);
  const [swapOverlay,setSwapOverlay]   = useState(null); 
  const [levelUpPopup,setLevelUpPopup]     = useState(null);
  const [weaponLvUp,setWeaponLvUp]         = useState(null); 
  const [trapRoll,setTrapRoll]         = useState(null);
  const [advRoll,setAdvRoll]           = useState(null); 
  const [resolvedDice,setResolvedDice] = useState(null); 
  const [chestResult,setChestResult]   = useState(null); 
  const [campMode,setCampMode]         = useState(false);
  const [campRestRoll,setCampRestRoll] = useState(null); 
  const [poiState,setPoiState]         = useState(null); 

  const pendingRoom  = useRef(null);
  const rollTimer    = useRef(null);
  const deathRecord  = useRef(null); 
  const [ghostLootPick,setGhostLootPick] = useState(null); 

  const log = useCallback((text,opts={})=>setLogs(p=>[...p,{text,...opts}].slice(-40)),[]);

  const derived = useMemo(()=>{
    if(!player) return {maxHp:0,armor:0,damageBonus:0,maxFocus:3};
    const activeWeapon = player.weapons?.[0] || STARTING_WEAPON;
    const ts = player.trinkets.filter(Boolean).reduce((a,t)=>{
      a.armor+=t.stats.armor||0; a.maxHp+=t.stats.maxHp||0;
      a.damage+=t.stats.damage||0; a.focusMax+=t.stats.focusMax||0;
      return a;
    },{armor:0,maxHp:0,damage:0,focusMax:0});
    const lvl = getLevel(player.xp || 0);
    return {
      maxHp:         player.baseMaxHp+ts.maxHp,
      armor:         player.baseArmor+activeWeapon.armor+ts.armor,
      damageBonus:   activeWeapon.dmgBonus+ts.damage,
      maxFocus:      2 + lvl + ts.focusMax,
      activeWeapon,
    };
  },[player]);

  const transition = useCallback((state)=>{
    setScreenAnim(true);
    setTimeout(()=>{setGs(state);setScreenAnim(false);},120);
  },[]);

  const showReveal = (key,cb) => setRoomReveal({cfg:REVEAL_CONFIGS[key]||REVEAL_CONFIGS.MONSTER,onConfirm:cb});
  const dismissReveal = () => { const cb=roomReveal?.onConfirm; setRoomReveal(null); if(cb)cb(); };

  const checkLevelUp = (prevXp,newXp,classId) => {
    const prev=getLevel(prevXp), nxt=getLevel(newXp);
    if(nxt<=prev) return;
    const cls=CLASSES.find(c=>c.id===classId);
    let unlocked=null;
    if(prev<2&&nxt>=2) unlocked=cls.ability1;
    else if(prev<4&&nxt>=4) unlocked=cls.ability2;
    setLevelUpPopup({level:nxt,ability:unlocked,onDismiss:()=>setLevelUpPopup(null)});
  };

  const acquireItem = (item, afterFn) => {
    if(item.type==='weapon') {
      const slots = player.weapons || [STARTING_WEAPON,null];
      const emptyIdx = slots.findIndex(w=>!w);
      if(emptyIdx>0) {
        setPlayer(p=>{const w=[...p.weapons];w[emptyIdx]=makeWeapon(item);return{...p,weapons:w};});
        log('Stored '+item.name+'.',{urgent:true});
        if(afterFn) afterFn();
      } else {
        setSwapOverlay({
          newItem: item,
          currentItems: [...slots],
          onSwap: (idx) => {
            setPlayer(p=>{const w=[...p.weapons];w[idx]=makeWeapon(item);return{...p,weapons:w};});
            log('Replaced with '+item.name+'.',{urgent:true});
            setSwapOverlay(null);
            if(afterFn) afterFn();
          },
          onSkip: () => { setSwapOverlay(null); if(afterFn) afterFn(); }
        });
      }
      return;
    }
    if(item.type==='trinket') {
      const slots = player.trinkets; 
      const emptyIdx = slots.findIndex(t=>!t);
      if(emptyIdx>=0) {
        setPlayer(p=>{const t=[...p.trinkets];t[emptyIdx]=item;return{...p,trinkets:t};});
        log('Gained '+item.name+'.',{urgent:true});
        if(afterFn) afterFn();
      } else {
        setSwapOverlay({
          newItem: item,
          currentItems: [...slots],
          onSwap: (idx) => {
            setPlayer(p=>{const t=[...p.trinkets];t[idx]=item;return{...p,trinkets:t};});
            log('Replaced with '+item.name+'.',{urgent:true});
            setSwapOverlay(null);
            if(afterFn) afterFn();
          },
          onSkip: () => { setSwapOverlay(null); if(afterFn) afterFn(); }
        });
      }
    }
  };

  const makeGrid = (floor,area,w,h) => {
    const biomeMap = generateBiomeGrid(w,h,floor);
    const nonSpecial = [];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(!(x===0&&y===0)&&!(x===w-1&&y===h-1)) nonSpecial.push({x,y});
    }
    const shuffled=[...nonSpecial].sort(()=>Math.random()-0.5);
    const merchantCell=shuffled[0];
    const poiCells=[];
    for(let i=1;i<shuffled.length&&poiCells.length<2;i++){
      if(Math.random()<0.18) poiCells.push(shuffled[i]);
    }
    const dr = deathRecord.current;
    let ghostCell = null;
    if(dr && dr.floor===floor) {
      let gx=dr.pos.x, gy=dr.pos.y;
      if(dr.isBossRoom) {
        const adj=[[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1]].filter(([x,y])=>x>=0&&y>=0&&x<w&&y<h&&!(x===0&&y===0));
        if(adj.length){[gx,gy]=adj[rng(adj.length)];}
      }
      if(!(gx===0&&gy===0)&&!(gx===w-1&&gy===h-1)) ghostCell={x:gx,y:gy};
    }

    const poiIds=poiCells.map(p=>{
      if(ghostCell&&p.x===ghostCell.x&&p.y===ghostCell.y) return POI_POOL[rng(POI_POOL.length)];
      const cellBiome=biomeMap[p.y][p.x];
      const biomePois=BIOME_POIS[cellBiome]||[];
      if(biomePois.length&&Math.random()<0.6) return biomePois[rng(biomePois.length)];
      return POI_POOL[rng(POI_POOL.length)];
    });

    const grid=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>{
      const isStart=x===0&&y===0, isExit=x===w-1&&y===h-1;
      const isMerchant=merchantCell&&merchantCell.x===x&&merchantCell.y===y;
      const poiIdx=poiCells.findIndex(p=>p.x===x&&p.y===y);
      const isGhost = ghostCell&&ghostCell.x===x&&ghostCell.y===y;
      let type=isStart?'ENTRANCE':isExit?'EXIT':isMerchant?'MERCHANT':isGhost?'POI':poiIdx>=0?'POI':ROOM_TYPES.filter(t=>t!=='MERCHANT')[rng(ROOM_TYPES.filter(t=>t!=='MERCHANT').length)];
      let hasThreat=null, treasureType=null;
      if(!isStart&&!isExit&&type!=='POI'&&Math.random()<0.10) hasThreat=Math.random()<0.5?'TRAP':'AMBUSH';
      if(type==='TREASURE') treasureType=rollChestType();
      const isGhostCell = ghostCell&&ghostCell.x===x&&ghostCell.y===y;
      const ghostPoiDef = isGhostCell && dr ? {
        id:'corpse', type:'body', name:dr.className+"'s Remains",
        flavor:'You recognize the gear strewn across the floor. You recognize the face. This was you.',
        goodReward:'GHOST_LOOT', badEffect:'GHOST_FIGHT',
        goodLabel:'You salvage what you can from the remains.',
        badLabel:'The body stirs. It remembers.',
        _deathRecord: dr,
      } : null;
      const poiDef=isGhostCell?ghostPoiDef:(poiIdx>=0?poiIds[poiIdx]:null);
      const biome=biomeMap[y][x]||'dungeon';
      return {x,y,type,visited:isStart,completed:isStart,hasThreat,treasureType,
        offeredTrinket:type==='MERCHANT'?generateTrinket('Normal'):null,
        poiDef,campTurns:0,biome};
    }));
    setDungeon({floor,area,pos:{x:0,y:0},grid,w,h});
  };

  const startGame = (cls) => {
    setPlayer({...cls,baseArmor:cls.armor,baseMaxHp:cls.hp,focus:Math.max(3, 2 + getLevel(0)),
      weapons:[STARTING_WEAPON,null], 
      trinkets:[null,null],
      armorDebuff:0,hasBlock:false,hasEvade:false});
    setLogs([{text:cls.name+' descended into the dungeon.'}]);
    makeGrid(1,1,3,3);
    transition('exploring');
  };

  const markDone = () => {
    setDungeon(prev=>{
      const g=prev.grid.map(r=>[...r]);
      g[prev.pos.y][prev.pos.x]={...g[prev.pos.y][prev.pos.x],completed:true};
      return {...prev,grid:g};
    });
  };

  const updateCampTurns = (turns) => {
    setDungeon(prev=>{
      const g=prev.grid.map(r=>[...r]);
      g[prev.pos.y][prev.pos.x]={...g[prev.pos.y][prev.pos.x],campTurns:turns};
      return {...prev,grid:g};
    });
  };

  const triggerRoom = (room) => {
    if(room.type==='EXIT'){
      dungeon.area===2?setupEncounter(dungeon.floor,true):transition('area_transition');
    } else if(room.type==='MONSTER') {
      setupEncounter(dungeon.floor,false,false);
    } else if(room.type==='POI') {
      setEncounter({type:'POI', poiDef:room.poiDef, phase:'intro'});
      transition('event');
    } else {
      setEncounter({type:room.type,offeredTrinket:room.offeredTrinket,treasureType:room.treasureType,merchantMood:'idle'});
      transition('event');
    }
  };

  const move = (tx,ty) => {
    if(gs!=='exploring') return;
    const g=dungeon.grid.map(r=>[...r]);
    const room=g[ty][tx];
    room.visited=true;
    setDungeon(p=>({...p,pos:{x:tx,y:ty},grid:g}));
    if(room.completed){
      if(room.campTurns>0){
        setCampMode(true);setGs('event');setEncounter({type:'CAMP'});return;
      }
      if(room.type==='MERCHANT'){
        setEncounter({type:'MERCHANT',offeredTrinket:room.offeredTrinket,treasureType:null,merchantMood:'idle'});
        transition('event');return;
      }
      setGs('exploring');return;
    }

    let rk;
    if(room.hasThreat==='AMBUSH') rk='AMBUSH';
    else if(room.hasThreat==='TRAP') rk='TRAP';
    else if(room.type==='TREASURE') rk='TREASURE_'+(room.treasureType||'barrel');
    else if(room.type==='EXIT'&&dungeon.area===2) rk='BOSS';
    else if(room.type==='POI'&&room.poiDef?.id==='corpse') rk='GHOST';
    else rk=room.type;

    showReveal(rk,()=>{
      if(room.hasThreat){
        pendingRoom.current=room;
        const threat=room.hasThreat; room.hasThreat=null;
        if(threat==='AMBUSH') setupEncounter(dungeon.floor,false,true);
        else {setEncounter({type:'TRAP'});log('A trap triggers!',{bad:true});transition('event');}
      } else {
        triggerRoom(room);
      }
    });
  };

  const descend = () => {
    let np={...player};
    if(np.food>0){np.food-=1;log('-1 food.');}
    else{np.hp-=3;log('Starving! -3 HP.',{bad:true,urgent:true});}
    if(np.hp<=0){setPlayer(np);transition('game_over');return;}
    let nArea=dungeon.area+1,nFloor=dungeon.floor,nW=dungeon.w,nH=dungeon.h;
    if(nArea>2){nArea=1;nFloor++;Math.random()>0.5?nW++:nH++;}
    setPlayer(np);
    if(nFloor>8){transition('victory');return;}
    makeGrid(nFloor,nArea,nW,nH);
    transition('exploring');
  };

  const executeRoll = (diceConfig,onDone,rollCtx={}) => {
    setDiceRoll({
      dice:diceConfig.map((d,i)=>({id:i,...d,result:null})),
      currentIndex:0,animVal:1,status:'rolling',onDone,
      ctx:rollCtx,
    });
  };

  useEffect(()=>{
    if(!diceRoll) return;
    const {status, currentIndex, dice} = diceRoll;

    if(status==='rolling'&&currentIndex<dice.length){
      let ticks=0;
      rollTimer.current=setInterval(()=>{
        ticks++;
        setDiceRoll(p=>p.status==='rolling'?{...p,animVal:rng(p.dice[p.currentIndex]?.faces||6)+1}:p);
        if(ticks>9){
          clearInterval(rollTimer.current);
          setDiceRoll(p=>{
            if(p.status!=='rolling') return p;
            const newDice=[...p.dice];
            const cur={...newDice[p.currentIndex]};
            cur.result=rng(cur.faces||6)+1;
            const activeW=player?.weapons?.[0];
            const explodeOn=(activeW?.special==='explode5')?5:6;
            if((activeW?.id==='legsword'||activeW?.id==='runeblade'||activeW?.special==='explode5')&&cur.type==='char'&&cur.result>=explodeOn)
              newDice.push({id:Math.random(),type:'crit',faces:activeW?.diceType||6,result:null});
            const ctx=p.ctx||{};
            const dieTag=ctx.abilityTag||ctx.weapon?.dmgTags?.[p.currentIndex]||ctx.weapon?.dmgTags?.[0]||'slashing';
            const aff=ctx.enemyId?(ENEMY_AFFINITIES[ctx.enemyId]||{weak:[],resist:[]}):{weak:[],resist:[]};
            if(cur.type==='char'&&aff.weak.includes(dieTag)&&cur.result!==1){
              const advRoll=rng(cur.faces||6)+1;
              cur._advDie1=cur.result;
              cur._advDie2=advRoll;
              cur._advChosen=Math.max(cur.result,advRoll);
              cur.result=cur._advChosen;
            }
            if(aff.resist.includes(dieTag)&&cur.result!==1){
              cur._resistApplied=true;
            }
            newDice[p.currentIndex]=cur;
            return{...p,dice:newDice,status:'pausing',animVal:cur.result};
          });
        }
      },60);
      return()=>clearInterval(rollTimer.current);

    } else if(status==='pausing'){
      const t=setTimeout(()=>{
        setDiceRoll(p=>{
          if(p.status!=='pausing') return p;
          const next=p.currentIndex+1;
          if(next>=p.dice.length){
            return{...p,status:'done',currentIndex:next};
          }
          return{...p,status:'rolling',currentIndex:next,animVal:1};
        });
      },300);
      return()=>clearTimeout(t);

    } else if(status==='done'){
      const done=diceRoll.onDone;
      const finalDice=diceRoll.dice;
      setDiceRoll(p=>({...p,status:'resolving'}));
      setTimeout(()=>{setDiceRoll(null);done(finalDice);},350);
    }
  },[diceRoll?.currentIndex,diceRoll?.status,diceRoll?.dice?.length]);

  const setupEncounter = (floor,isBoss,isAmbush=false,forceBiome=null) => {
    let e;
    if(isBoss){
      const bossDef=FLOOR_BOSSES[Math.min(floor,8)]||FLOOR_BOSSES[8];
      e={...bossDef,maxHp:bossDef.hp,isBoss:true};
    } else {
      const curBiome=forceBiome||(dungeon.grid[dungeon.pos?.y]?.[dungeon.pos?.x]?.biome)||'dungeon';
      const allPools=[...((BIOME_MONSTERS[curBiome]||[]))];
      const pool=allPools.filter(m=>m.minFloor<=floor);
      const t=pool.length?pool[rng(pool.length)]:(DUNGEON_MONSTERS.filter(m=>m.minFloor<=floor)[0]);
      const hp=t.hpBase+floor*3+rng(3);
      e={...t,hp,maxHp:hp,damage:t.dmgBase+floor,isBoss:false};
    }
    setEncounter(e);setIsPlayerTurn(!isAmbush);setGs('combat');setResolvedDice(null);
    if(isAmbush){log('Ambushed by '+e.name+'!',{bad:true,urgent:true});setTimeout(()=>doMonsterAttack(e),900);}
    else log(isBoss?'Boss: '+e.name:'Encountered '+e.name+'.',isBoss?{urgent:true}:{});
  };

  const doPlayerRoll = (ability=null) => {
    if(!isPlayerTurn||diceRoll||pendingAttack) return;
    const lvl=getLevel(player.xp);
    if(ability&&ability.unlockLv&&lvl<ability.unlockLv) return;
    setIsPlayerTurn(false);
    
    if(ability&&['HEAL_3','PURIFY','BLOCK','EVADE'].includes(ability.effectType)){
      setPlayer(p=>{const np={...p,focus:p.focus-ability.cost};
        if(ability.effectType==='HEAL_3'){np.hp=Math.min(derived.maxHp,np.hp+3);log('Restored 3 HP.',{urgent:true});}
        if(ability.effectType==='PURIFY'){np.armorDebuff=0;log('Armor restored.');}
        if(ability.effectType==='BLOCK'){np.hasBlock=true;log('Bracing for impact.');}
        if(ability.effectType==='EVADE'){np.hasEvade=true;log('Vanishing.');}
        return np;});
      setTimeout(()=>setEncounter(e=>{doMonsterAttack(e);return e;}),800);return;
    }
    if(ability) setPlayer(p=>({...p,focus:p.focus-ability.cost}));
    
    const aw = player.weapons?.[0]||STARTING_WEAPON;
    const lvlDice=getDiceCount(lvl);
    const weapDice = aw.diceCount||1;
    const extraDice = Math.max(0,lvlDice-1);
    const faces=aw.diceType||6;
    let cfg=Array.from({length:weapDice+extraDice},()=>({type:'char',faces}));
    
    let abilityTag = null;
    if(ability?.name==='Holy Strike') abilityTag='fire';
    if(ability?.name==='Fireball')    abilityTag='fire';
    const encId = encounter?.id;
    
    executeRoll(cfg,(rolled)=>{
      let dice=rolled.map(d=>({...d}));
      if(aw.id==='mace') dice=dice.map(d=>d.result%2===0?{...d,result:Math.max(0,d.result-3)}:d);
      if(aw.special==='critmax') dice=dice.map(d=>d.result===aw.diceType?{...d,result:d.result*2}:d);
      if(ability?.effectType==='MODIFIER'){
        if(ability.name==='Fireball')    dice=dice.map(d=>({...d,result:5,_advDie1:undefined,_advDie2:undefined,_advChosen:undefined}));
        if(ability.name==='Holy Strike') dice=dice.map(d=>({...d,result:d._advChosen?d._advChosen+2:d.result+2,_advChosen:d._advChosen?d._advChosen+2:undefined}));
        if(ability.name==='Backstab')    dice=dice.map(d=>d.result%2===0?{...d,result:d.result*2}:d);
      }
      setPendingAttack({ dice, ability, aw2:aw, abilityTag });
    },{abilityTag, weapon:aw, enemyId:encId});
  };

  const adjustDie = (index, delta) => {
    if ((player?.focus||0) < 1) return;
    setPendingAttack(pa => {
      const newDice = [...pa.dice];
      const d = newDice[index];
      const newVal = d.result + delta;
      if (newVal < 1) return pa;
      if (delta > 0 && d.result >= (d.faces||6)) return pa;
      newDice[index] = { ...d, result: newVal };
      return { ...pa, dice: newDice };
    });
    setPlayer(p => ({ ...p, focus: p.focus - 1 }));
  };

  const confirmAttack = () => {
    if(!pendingAttack) return;
    const { dice, ability, aw2, abilityTag } = pendingAttack;
    setPendingAttack(null);
    const enc = encounter;
    const {totalDmg, diceResults} = resolveDamage(dice, aw2, abilityTag, enc?.id, derived.damageBonus);
    const halfDmg = aw2.dur<=0;
    const dmg = halfDmg ? Math.floor(totalDmg*0.5) : totalDmg;
    
    const diceStr = diceResults.map(r=>{
      const tag = DMG_TYPE_LABELS[r.tag]||'';
      const mod = r.modified==='weak'?'!':r.modified==='resist'?'~':'';
      return r.finalResult+'['+tag+mod+']';
    }).join(',');
    const modNote = diceResults.some(r=>r.modified==='weak')?' WEAK!':diceResults.some(r=>r.modified==='resist')?' resisted':'';
    log('Rolled ['+diceStr+'] -> '+dmg+' dmg.'+modNote+(halfDmg?' (broken)':''),{urgent:dmg>0});
    
    setEncounter(e=>{
      const ne={...e,hp:e.hp-dmg};
      if(ne.hp<=0){handleMonsterDeath(ne);return ne;}
      if(ability?.effectType==='SKIP_ENEMY'){log('Enemy turn skipped.');setIsPlayerTurn(true);}
      else setTimeout(()=>doMonsterAttack(ne),700);
      return ne;
    });
  };

  const doMonsterAttack = (enc) => {
    executeRoll([{type:'enemy',faces:enc.diceType||6}],(rolled)=>{
      const r=rolled[0].result;
      setPlayer(p=>{
        const np={...p,weapons:[...(p.weapons||[STARTING_WEAPON,null,null])]};
        if(np.hasEvade){np.hasEvade=false;log('Enemy rolled '+r+'. Evaded!');setIsPlayerTurn(true);return np;}
        if(np.hasBlock){np.hasBlock=false;log('Enemy rolled '+r+'. Blocked!');setIsPlayerTurn(true);return np;}
        if(r===1){log('Enemy rolled 1. Miss!');setIsPlayerTurn(true);return np;}
        let effArmor=Math.max(0,derived.armor-p.armorDebuff);
        const crit=enc.diceType||6;
        if(enc.id==='slime'&&r>=3)effArmor=0;
        if(enc.id==='slime'&&r===crit){np.armorDebuff+=1;log('Acid melted 1 armor!',{bad:true});}
        if(r===crit)effArmor=0;
        if(enc.isGhost&&enc.ghostArmor>0) effArmor=Math.max(effArmor,enc.ghostArmor);
        const rawDmg=Math.max(0,enc.damage-effArmor);
        if(rawDmg>0){
          const aw=np.weapons[0]||STARTING_WEAPON;
          const wCopy={...aw};
          if(aw.weaponType==='defensive'){
            if(aw.dur<=0){
              np.hp-=rawDmg;
              log('Enemy rolled '+r+'. Broken shield! Hit for '+rawDmg+'.',{bad:true});
            } else {
              wCopy.dur=Math.max(0,aw.dur-rawDmg);
              if(wCopy.dur===0&&aw.dur>0)log('Your '+aw.name+' is broken!',{bad:true,urgent:true});
              else log('Enemy rolled '+r+'. '+aw.name+' absorbed '+rawDmg+'.',{bad:true});
            }
          } else {
            if(aw.dur<=0){
              np.hp-=rawDmg;
              log('Enemy rolled '+r+'. Broken weapon! Full '+rawDmg+' dmg.',{bad:true});
            } else {
              const playerDmg=Math.ceil(rawDmg/2);
              const weapDmg=Math.floor(rawDmg/2);
              np.hp-=playerDmg;
              wCopy.dur=Math.max(0,aw.dur-weapDmg);
              if(wCopy.dur===0&&aw.dur>0)log('Your '+aw.name+' is broken!',{bad:true,urgent:true});
              log('Enemy rolled '+r+'. Hit for '+playerDmg+' (weapon -'+weapDmg+').',{bad:true});
            }
          }
          np.weapons[0]=wCopy;
        } else {
          log('Enemy rolled '+r+'. Armor absorbs it.',{});
        }
        if(np.hp<=0){
        deathRecord.current = {
          floor: dungeon.floor,
          pos: {...dungeon.pos},
          isBossRoom: dungeon.grid[dungeon.pos?.y]?.[dungeon.pos?.x]?.type==='EXIT',
          className: p.name||'Unknown',
          classId: p.id,
          weapons: (p.weapons||[]).filter(Boolean).map(w=>({...w})),
          trinkets: (p.trinkets||[]).filter(Boolean).map(t=>({...t})),
          baseArmor: p.baseArmor||0,
          xp: p.xp||0,
          hp: p.hp,
        };
        setTimeout(()=>transition('game_over'),500);
      } else setIsPlayerTurn(true);
        return np;
      });
    });
  };

  const handleMonsterDeath = (e) => {
    const xpGain=e.isBoss?3:1,goldGain=e.isBoss?3:1;
    setPlayer(p=>{
      const np={...p,xp:p.xp+xpGain,gold:p.gold+goldGain};
      log(e.name+' defeated. +'+goldGain+'g +'+xpGain+'xp.');
      checkLevelUp(p.xp,np.xp,p.id);
      if(np.weapons&&np.weapons[0]){
        const ws=[...np.weapons];
        const aw={...ws[0]};
        aw.wXp=(aw.wXp||0)+1;
        const prevLv=getWeaponLevel((aw.wXp||1)-1);
        const newLv=getWeaponLevel(aw.wXp);
        if(newLv>prevLv) {
          if(newLv>=(aw.wMaxLv||3)) {
            const upgrades=WEAPON_UPGRADES[aw.baseId||aw.id];
            const usedTransforms=aw._transformCount||0;
            if(upgrades&&upgrades.transforms&&upgrades.transforms[usedTransforms]){
              const nextId=upgrades.transforms[usedTransforms];
              const nextBase=WEAPON_POOL.find(w=>w.id===nextId)||aw;
              const newW=makeWeapon({...nextBase,baseId:aw.baseId||aw.id,_transformCount:usedTransforms+1});
              ws[0]=newW;
              setTimeout(()=>setWeaponLvUp({transformed:true,oldName:aw.name,newWeapon:newW}),400);
            } else {
              aw.dmgBonus=(aw.dmgBonus||0)+1;
              aw.maxDur=Math.ceil(aw.maxDur*1.5);
              aw.dur=aw.maxDur;
              aw.wXp=0; aw.wLv=1;
              ws[0]=aw;
              setTimeout(()=>setWeaponLvUp({transformed:false,oldName:aw.name,newWeapon:aw}),400);
            }
          } else {
            aw.wLv=newLv;
            aw.dmgBonus=(aw.dmgBonus||0)+1;
            aw.maxDur=Math.ceil((aw.maxDur||9)*1.1);
            aw.dur=Math.min(aw.dur+3,aw.maxDur);
            ws[0]=aw;
            setTimeout(()=>setWeaponLvUp({transformed:false,oldName:aw.name,newWeapon:aw,leveledUp:true}),400);
          }
        } else {
          ws[0]=aw;
        }
        np.weapons=ws;
      }
      return np;
    });
    if(e.isBoss){
      markDone();
      const bossWeapon={...BASE_WEAPON_POOL[rng(BASE_WEAPON_POOL.length)],type:'weapon'};
      setLootQueue([bossWeapon]);
      setPostLoot(dungeon.floor>=4?'victory':'floor_transition');
      transition('loot');
    } else {
      if(e.poiWin==='GHOST_LOOT'){
        const dr3=e._deathRecord||deathRecord.current;
        if(dr3){
          const items=[
            ...((dr3.weapons||[]).filter(Boolean).slice(0,2).map(w=>({...w,type:'weapon'}))),
            ...((dr3.trinkets||[]).filter(Boolean).slice(0,2)),
          ].filter(Boolean);
          markDone();
          deathRecord.current=null; 
          if(items.length>0){
            setGhostLootPick({items,onPick:(item)=>{
              acquireItem(item,()=>{ setGhostLootPick(null); transition('exploring'); });
            }});
            setGs('ghost_loot');
          } else transition('exploring');
        } else { markDone(); transition('exploring'); }
        return;
      } else if(e.poiWin==='BODY_LOOT'){
        const drop={...BASE_WEAPON_POOL[rng(BASE_WEAPON_POOL.length)],type:'weapon'};
        markDone();setLootQueue([drop]);setPostLoot('exploring');transition('loot');
      } else if(Math.random()<0.40){
        const drop={...BASE_WEAPON_POOL[rng(BASE_WEAPON_POOL.length)],type:'weapon'};
        if(pendingRoom.current){const r=pendingRoom.current;pendingRoom.current=null;
          setLootQueue([drop]);setPostLoot('trigger_pending');transition('loot');}
        else{setLootQueue([drop]);setPostLoot('exploring');markDone();transition('loot');}
      } else {
        if(pendingRoom.current){const r=pendingRoom.current;pendingRoom.current=null;triggerRoom(r);}
        else{markDone();transition('exploring');}
      }
    }
  };

  const resolveEvent = (action) => {
    const type=encounter?.type;
    if(action==='leave'){transition('exploring');return;}

    if(type==='CAMP'||campMode){
      if(action==='rest'){
        const healAmount = 5; 
        setPlayer(p=>({...p,hp:Math.min(derived.maxHp,p.hp+healAmount), focus: Math.min(derived.maxFocus, (p.focus||0)+2)}));
        const newTurns=Math.max(0,(dungeon.grid[dungeon.pos.y]?.[dungeon.pos.x]?.campTurns||0)-1);
        updateCampTurns(newTurns);
        log(`Rested. +${healAmount} HP, +2 Focus.`,{urgent:true});
        setCampRestRoll(healAmount);
        if(newTurns<=0){
          setCampMode(false);setCampRestRoll(null);
          log('Camp exhausted.');
          transition('exploring');
        }
      } else if(action==='break'){
        setCampMode(false);setCampRestRoll(null);
        transition('exploring');
      }
      return;
    }

    if(type==='TRAP'){
      if(action==='endure'){setPlayer(p=>({...p,hp:Math.max(1,p.hp-2)}));log('Endured trap. -2 HP.',{bad:true});markDone();transition('exploring');}
      else if(action==='roll'){const roll=rng(6)+1;const dmg=roll>=4?0:1;const msg=roll>=4?'Rolled '+roll+'. Trap avoided!':'Rolled '+roll+'. Clipped. -1 HP.';setTrapRoll({roll,dmg,msg});}
      else if(action==='confirm_trap_roll'){const tr=trapRoll;setTrapRoll(null);if(tr.dmg>0)setPlayer(p=>({...p,hp:Math.max(1,p.hp-tr.dmg)}));log(tr.msg,tr.dmg>0?{bad:true}:{urgent:true});markDone();transition('exploring');}
      return;
    }

    if(type==='TREASURE'){
      if(action==='loot'){
        const tt=encounter.treasureType;
        const result=tt==='barrel'?rollBarrel():tt==='wood'?rollWoodChest():rollGoldChest();
        setPlayer(p=>({...p,gold:p.gold+(result.gold||0),food:p.food+(result.food||0)}));
        markDone();
        setChestResult({result,chestType:tt});
        setGs('chest_result');
      }
      return;
    }

    if(type==='MERCHANT'){
      if(action==='food'&&player.gold>=2){
        setPlayer(p=>({...p,gold:p.gold-2,food:p.food+1}));
        log('Bought food.');
        setEncounter(e=>({...e,merchantMood:'bought'}));
        setTimeout(()=>setEncounter(e=>({...e,merchantMood:'idle'})),1000);
        return;
      }
      if(action==='trinket'&&player.gold>=5&&encounter.offeredTrinket){
        setPlayer(p=>({...p,gold:p.gold-5}));
        log('Bought '+encounter.offeredTrinket.name+'.',{urgent:true});
        setEncounter(e=>({...e,merchantMood:'bought',offeredTrinket:null}));
        acquireItem(encounter.offeredTrinket,()=>{
          setGs('event');
          setTimeout(()=>setEncounter(e=>({...e,merchantMood:'idle'})),800);
        });
        return;
      }
      if(action==='merchant_leave'){
        markDone();
        setEncounter(e=>({...e,merchantMood:'left'}));
        setTimeout(()=>transition('exploring'),700);
        return;
      }
      return;
    }
  };

  const dismissChestResult = () => {
    const {result} = chestResult;
    setChestResult(null);
    if(result.trinket){
      acquireItem(result.trinket,()=>transition('exploring'));
    } else {
      transition('exploring');
    }
  };

  const setupCamp = () => {
    if((player?.food||0)<2){log('Need 2 food to make camp.',{bad:true});return;}
    setPlayer(p=>({...p,food:p.food-2}));
    updateCampTurns(3);
    setCampMode(true);
    setEncounter({type:'CAMP'});
    log('Made camp. 3 rest turns.',{urgent:true});
    setGs('event');
  };

  const processNextLoot = () => {
    const rest=lootQueue.slice(1);
    setLootQueue(rest);
    if(rest.length===0){
      if(postLoot==='floor_transition')transition('floor_transition');
      else if(postLoot==='victory')transition('victory');
      else if(postLoot==='trigger_pending'){
        const r=pendingRoom.current;pendingRoom.current=null;
        if(r)triggerRoom(r);else transition('exploring');
      }
      else transition('exploring');
    }
  };

  const takeLoot = (item) => { acquireItem(item,processNextLoot); };
  const skipLoot = () => { processNextLoot(); };

  const shell = (content,withBars=false) => {
    const lvl=player?getLevel(player.xp):1;
    const curRoom=dungeon.grid[dungeon.pos?.y]?.[dungeon.pos?.x];
    const hasCampTurns=curRoom?.campTurns>0;
    const canMakeCamp=withBars&&gs==='exploring'&&curRoom?.completed&&!hasCampTurns&&player?.food>0;
    return (
      <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',background:'#080808',overflow:'hidden',opacity:screenAnim?0:1,transition:'opacity 0.12s ease',maxWidth:480,margin:'0 auto'}}>
        {withBars&&player&&(<><StatRow player={player} derived={derived}/><EqBar weapons={player.weapons} trinkets={player.trinkets} level={lvl}/></>)}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
          {content}
          {canMakeCamp&&(
            <button className="btn btn-green" onClick={setupCamp} disabled={(player?.food||0)<2} style={{position:'absolute',bottom:96,right:12,padding:'8px 12px',gap:6,fontSize:8}}>
              <ICamp size={12}/> Make Camp (-2 food)
            </button>
          )}
          {withBars&&gs==='exploring'&&hasCampTurns&&(
            <button className="btn btn-green" onClick={()=>{setCampMode(true);setEncounter({type:'CAMP'});setGs('event');}} style={{position:'absolute',bottom:96,right:12,padding:'8px 12px',gap:6,fontSize:8}}>
              <ICamp size={12}/> Camp ({curRoom.campTurns})
            </button>
          )}
          {roomReveal&&(
            <div onClick={dismissReveal} style={{position:'absolute',inset:0,zIndex:50,background:'rgba(0,0,0,0.88)',display:'flex',alignItems:'center',justifyContent:'center',padding:32}}>
              <div className="anim-overlay" onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:300,border:'1px solid '+roomReveal.cfg.accent,background:'#0a0a0a'}}>
                <div style={{height:2,background:roomReveal.cfg.accent}}/>
                <div style={{padding:'24px 20px',display:'flex',flexDirection:'column',gap:14}}>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <span style={{color:roomReveal.cfg.textAccent}}><roomReveal.cfg.icon size={22}/></span>
                    <div>
                      <div className="cinzel" style={{fontSize:15,color:roomReveal.cfg.textAccent,letterSpacing:'0.04em'}}>{roomReveal.cfg.label}</div>
                      <div style={{fontSize:8,letterSpacing:'0.18em',color:'#2e2e2e',textTransform:'uppercase',marginTop:3}}>{roomReveal.cfg.sub}</div>
                    </div>
                  </div>
                  <button className="btn btn-primary" onClick={dismissReveal} style={{width:'100%',padding:'11px',gap:8,borderColor:roomReveal.cfg.accent,color:roomReveal.cfg.textAccent}}><IArrow size={12}/> Continue</button>
                </div>
              </div>
            </div>
          )}
          {swapOverlay&&<SwapOverlay newItem={swapOverlay.newItem} currentItems={swapOverlay.currentItems} onSwap={swapOverlay.onSwap} onSkip={swapOverlay.onSkip}/>}
          {levelUpPopup&&<LevelUpOverlay level={levelUpPopup.level} unlockedAbility={levelUpPopup.ability} onDismiss={levelUpPopup.onDismiss}/>}
          {weaponLvUp&&<WeaponLvUpOverlay data={weaponLvUp} onDismiss={()=>setWeaponLvUp(null)}/>}
        </div>
        {withBars&&<Chronicle logs={logs}/>}
      </div>
    );
  };

  if(gs==='menu') return shell(
    <div style={{flex:1,display:'flex',flexDirection:'column',padding:'28px 20px',overflowY:'auto'}}>
      <div style={{marginBottom:28}}>
        <div className="cinzel" style={{fontSize:24,letterSpacing:'0.08em',color:'#777',fontWeight:600,marginBottom:5}}>Mini Rogue</div>
        <div style={{fontSize:8,letterSpacing:'0.25em',color:'#1e1e1e',textTransform:'uppercase'}}>Choose your class to descend</div>
      </div>
      {CLASSES.map((cls,i)=>{const Ic=cls.icon;return(
        <div key={cls.id} className="anim-fade" style={{animationDelay:i*0.06+'s',animationFillMode:'both',opacity:0}}>
          <button className="btn btn-primary" onClick={()=>startGame(cls)} style={{width:'100%',justifyContent:'flex-start',gap:14,padding:'14px',marginBottom:7,textAlign:'left'}}>
            <span style={{color:'#2e2e2e',flexShrink:0}}><Ic size={17}/></span>
            <span style={{display:'flex',flexDirection:'column',gap:3,alignItems:'flex-start'}}>
              <span style={{fontSize:11,color:'#888',letterSpacing:'0.1em'}}>{cls.name}</span>
              <span style={{fontSize:8,color:'#2e2e2e',letterSpacing:'0.08em'}}>{cls.desc}</span>
              <span style={{fontSize:7,color:'#1e1e1e',letterSpacing:'0.08em'}}>HP{cls.hp} / ARM{cls.armor} / FOOD{cls.food} / GOLD{cls.gold} / Spells at LV2 & LV4</span>
            </span>
          </button>
        </div>
      );})}
      <div style={{marginTop:20,fontSize:8,letterSpacing:'0.15em',color:'#181818',textTransform:'uppercase',lineHeight:2.2}}>Descend 4 floors. Defeat the warden. Return with glory.</div>
    </div>
  );

  if(gs==='exploring'||gs==='revealing'){
    const{grid,pos,w,h,floor,area}=dungeon;
    const reachable=(x,y)=>(x!==pos.x||y!==pos.y)&&((Math.abs(x-pos.x)===1&&y===pos.y)||(Math.abs(y-pos.y)===1&&x===pos.x));
    const roomIcon=(type,tt)=>type==='TREASURE'?(tt==='barrel'?IBarrel:tt==='gold'?IGold:IChest):{MONSTER:ISkull,MERCHANT:IShop,EXIT:IExit,ENTRANCE:null,TRAP:ITrap,POI:IEye}[type]||null;
    const cellSz=Math.min(68,320/Math.max(w,h));
    return shell(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:16,gap:12}}>
        <div style={{fontSize:8,letterSpacing:'0.2em',textTransform:'uppercase',display:'flex',gap:8,alignItems:'center'}}>
          <span style={{color:'#222'}}>Floor {floor} / Area {area}</span>
          {(()=>{const biomes=[...new Set(grid.flat().map(c=>c.biome).filter(b=>b&&b!=='dungeon'))];
            return biomes.map(b=><span key={b} style={{color:BIOMES[b]?.textColor||'#333',fontSize:7}}>{b.toUpperCase()}</span>);})()}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat('+w+','+cellSz+'px)',gap:4}}>
          {grid.map(row=>row.map(cell=>{
            const isCur=cell.x===pos.x&&cell.y===pos.y,isReach=reachable(cell.x,cell.y);
            const Ic=cell.visited?roomIcon(cell.type,cell.treasureType):null;
            const chestColor=cell.treasureType==='gold'?'#7a6020':cell.treasureType==='barrel'?'#3a5a2a':'#4a4a30';
            const isMerchant=cell.type==='MERCHANT', hasCamp=cell.campTurns>0;
            const isRevisitable=cell.completed&&(isMerchant||hasCamp);
            return(
              <div key={cell.x+'-'+cell.y} onClick={()=>isReach&&move(cell.x,cell.y)}
                style={{width:cellSz,height:cellSz,border:'1px solid '+(isCur?'#555':isReach?'#2a2a2a':cell.visited?'#161616':'#0e0e0e'),display:'flex',alignItems:'center',justifyContent:'center',cursor:isReach?'pointer':'default',background:isCur?'rgba(255,255,255,0.025)':isReach?'rgba(255,255,255,0.01)':'transparent',opacity:cell.visited?1:0.2,transition:'border-color 0.15s',position:'relative',flexDirection:'column',gap:2}}>
                {isCur&&<div style={{width:5,height:5,borderRadius:'50%',background:'#666'}}/>}
                {!isCur&&cell.visited&&Ic&&<span style={{color:cell.completed&&!isRevisitable?'#1a1a1a':cell.type==='EXIT'?'#555':cell.type==='TREASURE'?chestColor:isMerchant?'#3a4a5a':hasCamp?'#3a5a3a':'#303030',display:'flex'}}><Ic size={13}/></span>}
                {hasCamp&&!isCur&&<span style={{color:'#3a5a3a',position:'absolute',top:3,right:3,display:'flex'}}><ICamp size={8}/></span>}
                {isReach&&<div style={{fontSize:6,letterSpacing:'0.08em',textTransform:'uppercase',marginTop:cell.visited?2:0,color:BIOMES[cell.biome]?.textColor||'#1e1e1e'}}>{cell.visited&&!cell.completed?cell.type.slice(0,3):cell.visited?'...':'???'}</div>}
                {cell.visited&&cell.biome!=='dungeon'&&!isCur&&<div style={{fontSize:5,color:BIOMES[cell.biome]?.textColor||'#1e1e1e',letterSpacing:'0.06em',textTransform:'uppercase',position:'absolute',top:2,left:2}}>{cell.biome.slice(0,3).toUpperCase()}</div>}
                {cell.completed&&!isCur&&!isRevisitable&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.35)'}}/>}
              </div>
            );
          }))}
        </div>
        {grid[pos.y]?.[pos.x]?.type==='EXIT'&&<button className="btn btn-primary" onClick={descend} style={{gap:8,padding:'11px 22px',marginTop:6}}><IArrow size={13}/> Descend</button>}
      </div>
    ,true);
  }

  if(gs==='chest_result'&&chestResult){
    return shell(
      <ChestResultScreen result={chestResult.result} chestType={chestResult.chestType} onContinue={dismissChestResult}/>
    ,true);
  }

  if(gs==='combat'&&encounter){
    const lvl=getLevel(player?.xp||0);
    const cls=CLASSES.find(c=>c.id===player?.id)||CLASSES[0];
    const hpPct=Math.max(0,encounter.hp/encounter.maxHp);
    const a1Unlocked=lvl>=cls.ability1.unlockLv,a2Unlocked=lvl>=cls.ability2.unlockLv;
    const canA1=a1Unlocked&&(player?.focus||0)>=cls.ability1.cost;
    const canA2=a2Unlocked&&(player?.focus||0)>=cls.ability2.cost;
    return shell(
      <div style={{flex:1,display:'flex',flexDirection:'column',padding:16,gap:0,overflowY:'auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10,flexShrink:0}}>
          <div style={{border:'1px solid #1a1a1a',padding:'6px',display:'flex',flexDirection:'column',gap:4,background:'#060606'}}>
            <div style={{fontSize:7,letterSpacing:'0.2em',color:'#2a2a2a',textTransform:'uppercase'}}>
              {player?.name||'Hero'}
            </div>
            <div style={{height:72,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
              {(()=>{const P=PLAYER_PORTRAITS[player?.id]||PortraitCrusader;return <P hit={!isPlayerTurn&&!!diceRoll}/>;})()}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:8,color:'#555'}}>HP {player?.hp}/{derived.maxHp} / {derived.activeWeapon?.name||'—'}</div>
              <div className="hp-bar-track" style={{width:'50%'}}><div className="hp-bar-fill" style={{width:Math.max(0,(player?.hp/derived.maxHp)*100)+'%',background:player?.hp/derived.maxHp<0.35?'#7a3333':'#445544'}}/></div>
            </div>
          </div>
          <div style={{border:'1px solid '+(encounter.isGhost?'#2a2a4a':encounter.isBoss?'#2a1a08':'#1a1a1a'),padding:'6px',display:'flex',flexDirection:'column',gap:4,background:'#060606'}}>
            <div style={{fontSize:7,letterSpacing:'0.2em',color:encounter.isGhost?'#6060a0':encounter.isBoss?'#4a2a08':'#2a2a2a',textTransform:'uppercase',lineHeight:2}}>
              {encounter.name}
              {(()=>{const aff=ENEMY_AFFINITIES[encounter.id];if(!aff)return null;return(
                <span style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:1}}>
                  {aff.weak.map(w=><span key={w} style={{fontSize:6,color:DMG_TYPE_COLORS[w]||'#555',letterSpacing:'0.08em'}}>WK:{DMG_TYPE_LABELS[w]}</span>)}
                  {aff.resist.map(r=><span key={r} style={{fontSize:6,color:'#3a2a2a',letterSpacing:'0.08em'}}>RS:{DMG_TYPE_LABELS[r]}</span>)}
                </span>
              );})()}
            </div>
            <div style={{height:72,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
              {(()=>{
                let E;
                if(encounter.isGhost&&encounter._deathRecord?.classId){
                  E=PLAYER_PORTRAITS[encounter._deathRecord.classId]||PortraitCrusader;
                } else {
                  E=ALL_ENEMY_PORTRAITS[encounter.id]||PortraitGoblin;
                }
                return <E hit={isPlayerTurn&&!!diceRoll}/>;
              })()}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:8,color:'#555'}}>HP {Math.max(0,encounter.hp)}/{encounter.maxHp}</div>
              {encounter.biome&&encounter.biome!=='dungeon'&&(
                <div style={{fontSize:6,letterSpacing:'0.1em',textTransform:'uppercase',color:BIOMES[encounter.biome]?.textColor||'#333'}}>{encounter.biome.toUpperCase()}</div>
              )}
              <div className="hp-bar-track" style={{width:'50%'}}><div className={'hp-bar-fill'+(hpPct<0.35?' low':'')+(encounter.isBoss?' boss':'')} style={{width:hpPct*100+'%'}}/></div>
            </div>
          </div>
        </div>

        {pendingAttack ? (
          <div style={{display:'flex',flexDirection:'column',gap:8,alignItems:'center',minHeight:64,flexShrink:0,background:'rgba(255,255,255,0.02)',padding:'8px 0',borderRadius:4,border:'1px solid #1a1a1a'}}>
            <div style={{fontSize:7,letterSpacing:'0.15em',color:'#a0a030',textTransform:'uppercase'}}>Spend focus to alter dice</div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              {pendingAttack.dice.map((d,i)=>(
                <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <button className="btn" style={{padding:'2px 10px',minHeight:20,fontSize:14,border:'1px solid #333',color:(player?.focus||0)>0&&d.result<(d.faces||6)?'#ccc':'#444'}} disabled={(player?.focus||0)<1||d.result>=(d.faces||6)} onClick={()=>adjustDie(i,1)}>+</button>
                  <div style={{
                    width:38,height:50,border:'1px solid #a0a030',
                    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                    fontSize:16,fontWeight:'bold',color:'#e0e080',gap:1,background:'rgba(160,160,48,0.05)'
                  }}>
                    <span>{d.result}</span>
                    {d.faces!==6 && <span style={{fontSize:5,color:'#1e1e1e',marginTop:-1}}>d{d.faces}</span>}
                  </div>
                  <button className="btn" style={{padding:'2px 10px',minHeight:20,fontSize:14,border:'1px solid #333',color:(player?.focus||0)>0&&d.result>1?'#ccc':'#444'}} disabled={(player?.focus||0)<1||d.result<=1} onClick={()=>adjustDie(i,-1)}>-</button>
                </div>
              ))}
            </div>
            <button className="btn btn-primary" onClick={confirmAttack} style={{padding:'8px 24px',gap:8,borderColor:'#a0a030',color:'#c0c060'}}><ISword size={12}/> Strike</button>
          </div>
        ) : (
          <DiceTray diceRoll={diceRoll} weapon={derived.activeWeapon} abilityTag={null} resolvedDice={resolvedDice}/>
        )}

        <div style={{textAlign:'center',marginBottom:10,fontSize:8,letterSpacing:'0.2em',textTransform:'uppercase',color:isPlayerTurn&&!diceRoll?'#555':'#1e1e1e'}}>
          {diceRoll?(diceRoll.dice[0]?.type==='enemy'?'Enemy rolling...':'Your roll...'):(pendingAttack?'Modify your roll':(isPlayerTurn?'Your turn':'Enemy turn'))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,marginBottom:5}}>
          <button className="btn btn-primary" disabled={!isPlayerTurn||!!diceRoll||!!pendingAttack} onClick={()=>doPlayerRoll(null)} style={{padding:'13px 8px',flexDirection:'column',gap:4}}>
            <IZap size={13}/><span style={{fontSize:8}}>Attack</span><span style={{fontSize:7,color:'#333'}}>{getDiceCount(lvl)}d{player?.weapon?.diceType||6}</span>
          </button>
          <button className="btn" disabled={!isPlayerTurn||!canA1||!!diceRoll||!!pendingAttack} onClick={()=>doPlayerRoll(cls.ability1)} style={{padding:'13px 8px',flexDirection:'column',gap:4}}>
            {a1Unlocked?<IStar size={13}/>:<ILock size={13}/>}
            <span style={{fontSize:8}}>{cls.ability1.name}</span>
            <span style={{fontSize:7,color:'#333'}}>{a1Unlocked?cls.ability1.cost+' focus':'LV2'}</span>
          </button>
        </div>
        <button className="btn" disabled={!isPlayerTurn||!canA2||!!diceRoll||!!pendingAttack} onClick={()=>doPlayerRoll(cls.ability2)} style={{width:'100%',padding:'10px',gap:8,marginBottom:5}}>
          {a2Unlocked?<IFlame size={13}/>:<ILock size={13}/>}
          <span style={{fontSize:8}}>{a2Unlocked?cls.ability2.name+' / '+cls.ability2.cost+' focus / '+cls.ability2.desc:cls.ability2.name+' / Unlocks at LV4'}</span>
        </button>
        <div style={{borderTop:'1px solid #0e0e0e',paddingTop:8,marginTop:2,display:'flex',flexDirection:'column',gap:4}}>
          <div style={{fontSize:7,letterSpacing:'0.2em',color:'#1e1e1e',textTransform:'uppercase',marginBottom:2}}>Weapons</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:4}}>
            {(player?.weapons||[null,null]).map((w,i)=>{
              const isActive=i===0;
              const broken=w&&w.dur<=0;
              const durPct=w?w.dur/w.maxDur:0;
              return (
                <div key={i} onClick={()=>{
                  if(!isPlayerTurn||!!diceRoll||!!pendingAttack||!w||isActive)return;
                  setPlayer(p=>{const ws=[...(p.weapons||[STARTING_WEAPON,null])];const tmp=ws[0];ws[0]=ws[i];ws[i]=tmp;return{...p,weapons:ws};});
                  setIsPlayerTurn(false);
                  log('Swapped to '+w.name+'.');
                  setTimeout(()=>setEncounter(e=>{doMonsterAttack(e);return e;}),600);
                }}
                style={{
                  border:'1px solid '+(isActive?'#444':'#1a1a1a'),
                  padding:'5px 4px',
                  background:isActive?'rgba(255,255,255,0.02)':'transparent',
                  cursor:(!isActive&&w&&isPlayerTurn&&!diceRoll&&!pendingAttack)?'pointer':'default',
                  opacity:w?1:0.2,
                  display:'flex',flexDirection:'column',gap:3,
                }}>
                  <div style={{fontSize:7,letterSpacing:'0.08em',color:isActive?'#666':broken?'#5a2a2a':'#333',textTransform:'uppercase',lineHeight:1.2}}>
                    {w?w.name:'empty'}
                  </div>
                  {w&&<div style={{fontSize:6,color:'#282828',textTransform:'uppercase'}}>{w.weaponType==='defensive'?'DEF':'AGG'} / {w.diceCount}d{w.diceType}</div>}
                  {w&&<div style={{fontSize:6,textTransform:'uppercase',display:'flex',gap:3,flexWrap:'wrap'}}>
                    {[...new Set(w.dmgTags||[])].map(t=>(
                      <span key={t} style={{color:DMG_TYPE_COLORS[t]||'#333'}}>{DMG_TYPE_LABELS[t]||t}</span>
                    ))}
                    {w.dur<=0&&<span style={{color:'#6a2020'}}>BRK</span>}
                  </div>}
                  {w&&<div style={{background:'#111',height:2,width:'100%'}}>
                    <div style={{background:broken?'#5a2020':durPct>0.5?'#3a5a3a':'#6a4020',height:2,width:(durPct*100)+'%',transition:'width 0.3s'}}/>
                  </div>}
                  {w&&<div style={{fontSize:6,color:broken?'#5a2020':'#222',textTransform:'uppercase'}}>{w.dur}/{w.maxDur}{broken?' BRK':''}</div>}
                  {w&&!broken&&(()=>{
                    const wlv=getWeaponLevel(w.wXp||0);
                    const toNext=xpToNextWLv(w.wXp||0,w.wMaxLv||3);
                    const prevThresh=WEAPON_LV_XP[wlv-1]||0;
                    const nextThresh=toNext!=null?WEAPON_LV_XP[wlv]||prevThresh:prevThresh;
                    const pct=toNext!=null?(((w.wXp||0)-prevThresh)/(nextThresh-prevThresh))*100:100;
                    return (
                      <div style={{display:'flex',flexDirection:'column',gap:1,marginTop:1}}>
                        <div style={{background:'#0a0a0a',height:2,width:'100%'}}>
                          <div style={{background:toNext===null?'#6a4020':'#1a3a5a',height:2,width:pct+'%',transition:'width 0.3s'}}/>
                        </div>
                        <div style={{fontSize:5,color:'#1e1e1e',textTransform:'uppercase',letterSpacing:'0.05em'}}>
                          WLV{wlv}{toNext!=null?' +'+toNext+'kill'+(toNext===1?'':'s'):' MAX'}
                        </div>
                      </div>
                    );
                  })()}
                  {!isActive&&w&&isPlayerTurn&&!diceRoll&&!pendingAttack&&<div style={{fontSize:6,color:'#2a3a2a',textTransform:'uppercase'}}>tap swap</div>}
                </div>
              );
            })}
          </div>
        </div>
        <button className="btn btn-green" disabled={!isPlayerTurn||!!diceRoll||!!pendingAttack||(player?.food||0)<=0}
          onClick={()=>{
            if(!isPlayerTurn||diceRoll||pendingAttack) return;
            setIsPlayerTurn(false);
            const roll=rng(4)+1;
            setPlayer(p=>({...p,hp:Math.min(derived.maxHp,p.hp+roll),food:p.food-1, focus: Math.min(derived.maxFocus, (p.focus||0)+2)}));
            log(`Ate food. +${roll} HP, +2 Focus.`,{urgent:true});
            setTimeout(()=>setEncounter(e=>{doMonsterAttack(e);return e;}),600);
          }}
          style={{width:'100%',padding:'8px',gap:8,marginTop:4,fontSize:9}}>
          <IDrum size={12}/> Eat Food (1d4 HP, 2 Focus) — {player?.food||0} left
        </button>
      </div>
    ,true);
  }

  if(gs==='event'&&encounter){
    const type=encounter.type;
    const tt=encounter.treasureType;
    const chestLabel=tt==='gold'?'Gold Chest':tt==='barrel'?'Barrel':'Wooden Chest';
    const chestColor=tt==='gold'?'#b09030':tt==='barrel'?'#508050':'#707050';
    const ChestIco=tt==='gold'?IGold:tt==='barrel'?IBarrel:IChest;

    if(type==='CAMP'||campMode){
      const curRoom=dungeon.grid[dungeon.pos?.y]?.[dungeon.pos?.x];
      return shell(<CampScreen camp={curRoom} maxHp={derived.maxHp} onRest={()=>resolveEvent('rest')} onLeave={()=>resolveEvent('break')}/>,true);
    }

    const Cfg={TREASURE:{icon:ChestIco,title:chestLabel,color:chestColor},MERCHANT:{icon:IShop,title:'Wandering Merchant',color:'#507090'},TRAP:{icon:ITrap,title:'Hidden Trap',color:'#b05050'},POI:{icon:IEye,title:encounter?.poiDef?.name||'Point of Interest',color:'#806090'}}[type]||{icon:ISkull,title:type,color:'#555'};
    const Ic=Cfg.icon;
    return shell(
      <div style={{flex:1,display:'flex',flexDirection:'column',padding:20,gap:14,overflowY:'auto'}} className="anim-fade">
        <div style={{display:'flex',alignItems:'center',gap:12,paddingBottom:14,borderBottom:'1px solid #0e0e0e'}}>
          <span style={{color:Cfg.color}}><Ic size={20}/></span>
          <div>
            <div style={{fontSize:11,letterSpacing:'0.1em',color:'#666',textTransform:'uppercase'}}>{Cfg.title}</div>
            <div style={{fontSize:8,color:'#1e1e1e',letterSpacing:'0.1em',marginTop:2,textTransform:'uppercase'}}>
              {type==='TREASURE'&&'Roll d6 to discover contents.'}
              {type==='MERCHANT'&&'Trade what you must. You may return.'}
              {type==='TRAP'&&'The floor gives way.'}
              {type==='POI'&&''}
            </div>
          </div>
        </div>

        {type==='TREASURE'&&<div style={{display:'flex',flexDirection:'column',gap:5}}>
          <div style={{border:'1px solid #141414',padding:'10px 12px',fontSize:8,letterSpacing:'0.1em',color:'#252525',textTransform:'uppercase',lineHeight:2}}>
            {tt==='barrel'&&<><div>1-3: food</div><div>4-5: gold</div><div>6: gold + food</div></>}
            {tt==='wood'&&<><div>1-2: food</div><div>3-4: gold</div><div>5: gold + food</div><div>6: relic</div></>}
            {tt==='gold'&&<><div>1-2: gold</div><div>3-4: more gold</div><div>5: gold + relic</div><div>6: rare relic</div></>}
          </div>
          <button className="btn btn-primary" onClick={()=>resolveEvent('loot')} style={{justifyContent:'space-between',padding:'13px 14px',borderColor:chestColor,color:chestColor}}><span>Open & Roll</span><ChestIco size={13}/></button>
          <button className="btn" onClick={()=>resolveEvent('leave')} style={{padding:'10px'}}>Leave it</button>
        </div>}

        {type==='MERCHANT'&&<div style={{display:'flex',flexDirection:'column',gap:5}}>
          <div style={{marginBottom:4}}>
            <PortraitMerchant mood={encounter.merchantMood||'idle'}/>
          </div>
          {[
            {action:'food',   label:'Buy Food',   cost:2, right:'+1 food'},
            {action:'trinket',label:encounter.offeredTrinket?.name||'Relic',cost:5,right:encounter.offeredTrinket?.desc||''},
          ].map(opt=>(
            <button key={opt.action} className="btn" disabled={(player?.gold||0)<opt.cost}
              onClick={()=>resolveEvent(opt.action)}
              style={{justifyContent:'space-between',padding:'13px 14px'}}
              onMouseEnter={()=>setEncounter(e=>({...e,merchantMood:'browsing'}))}
              onMouseLeave={()=>setEncounter(e=>({...e,merchantMood:'idle'}))}>
              <span>{opt.label}</span><span style={{display:'flex',gap:8}}><span style={{color:'#444'}}>{opt.right}</span><span style={{color:'#333'}}>{opt.cost}g</span></span>
            </button>
          ))}
          {(player?.weapons||[]).map((w,i)=>{
            if(!w) return null;
            const broken=w.dur<=0;const needsRepair=w.dur<w.maxDur;
            if(!needsRepair)return null;
            return (
              <button key={'repair'+i} className="btn btn-amber"
                disabled={(player?.gold||0)<5}
                onClick={()=>{
                  setEncounter(e=>({...e,merchantMood:'bought'}));
                  setPlayer(p=>{const ws=[...p.weapons];ws[i]={...ws[i],dur:ws[i].maxDur};return{...p,gold:p.gold-5,weapons:ws};});
                  log('Repaired '+w.name+'.',{urgent:true});
                  setTimeout(()=>setEncounter(e=>({...e,merchantMood:'idle'})),800);
                }}
                style={{justifyContent:'space-between',padding:'13px 14px'}}>
                <span>Repair {w.name}{broken?' [BROKEN]':' ('+w.dur+'/'+w.maxDur+')'}</span>
                <span style={{color:'#333'}}>5g</span>
              </button>
            );
          })}
          <button className="btn" onClick={()=>resolveEvent('merchant_leave')} style={{padding:'10px',marginTop:2}}>Leave shop</button>
        </div>}

        {type==='TRAP'&&!trapRoll&&<div style={{display:'flex',flexDirection:'column',gap:5}}>
          <div style={{border:'1px solid #2a1a0a',padding:'10px 12px',fontSize:8,letterSpacing:'0.1em',color:'#333',textTransform:'uppercase',lineHeight:2}}>
            <div>Endure: -2 HP</div><div>Dodge: roll d6 / 4+ avoids / 1-3 takes 1</div>
          </div>
          <button className="btn btn-danger" onClick={()=>resolveEvent('endure')} style={{justifyContent:'space-between',padding:'13px 14px'}}><span>Endure</span><span>-2 HP</span></button>
          <button className="btn btn-amber" onClick={()=>resolveEvent('roll')} style={{justifyContent:'space-between',padding:'13px 14px'}}><span>Attempt to dodge</span><span>Roll d6</span></button>
        </div>}

        {type==='POI'&&(()=>{
          const poi = encounter?.poiDef;
          if(!poi) return null;
          const phase = encounter?.phase||'intro';
          const isBody = poi.id==='corpse';
          const accentColor = isBody?'#5a2a2a':'#3a2a5a';
          const textAccent  = isBody?'#c06060':'#9060c0';

          if(phase==='intro') return (
            <div style={{display:'flex',flexDirection:'column',gap:12}} className="anim-fade">
              <div style={{border:'1px solid '+accentColor,padding:'12px 14px',background:'#080808'}}>
                <div style={{fontSize:7,letterSpacing:'0.2em',color:accentColor,textTransform:'uppercase',marginBottom:6}}>
                  {poi.type==='abc'?'Trial':'Point of Interest'}
                  {isBody&&<span style={{marginLeft:8,color:'#6a2020'}}>⚠ Danger</span>}
                </div>
                <div style={{fontSize:11,color:textAccent,letterSpacing:'0.06em',marginBottom:8}}>{poi.name}</div>
                <div style={{fontSize:8,color:'#2a2a2a',letterSpacing:'0.1em',lineHeight:1.8,textTransform:'uppercase'}}>{poi.flavor}</div>
              </div>

              {poi.type==='roll'&&(
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{fontSize:7,color:'#222',letterSpacing:'0.12em',textTransform:'uppercase',padding:'4px 0'}}>
                    Roll d6: 1-3 bad · 4-6 good
                  </div>
                  <button className="btn btn-primary" style={{padding:'12px',gap:8,borderColor:accentColor,color:textAccent}}
                    onClick={()=>{
                      const roll=rng(6)+1;
                      const success=roll>=4;
                      setEncounter(e=>({...e,phase:'result',roll,success}));
                    }}>
                    Roll the dice
                  </button>
                  <button className="btn" style={{padding:'10px'}} onClick={()=>{markDone();transition('exploring');}}>
                    Leave it alone
                  </button>
                </div>
              )}

              {poi.type==='abc'&&(
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{fontSize:9,color:'#555',letterSpacing:'0.1em',textTransform:'uppercase',padding:'4px 0'}}>{poi.question}</div>
                  {poi.options.map((opt,oi)=>(
                    <button key={oi} className="btn" style={{padding:'12px 14px',justifyContent:'flex-start',gap:8}}
                      onClick={()=>{
                        const correct=oi===poi.answer;
                        setEncounter(e=>({...e,phase:'result',roll:correct?6:1,success:correct,chosenIdx:oi}));
                      }}>
                      <span style={{color:'#3a2a5a',minWidth:14}}>{opt.slice(0,1)}.</span>
                      <span>{opt.slice(3)}</span>
                    </button>
                  ))}
                  <button className="btn" style={{padding:'10px'}} onClick={()=>{markDone();transition('exploring');}}>
                    Walk away
                  </button>
                </div>
              )}

              {poi.type==='body'&&(
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{fontSize:7,color:'#333',letterSpacing:'0.12em',textTransform:'uppercase',padding:'4px 0'}}>
                    Roll d6 to loot: 4+ success · 1-3 the body rises
                  </div>
                  <button className="btn btn-danger" style={{padding:'12px',gap:8}}
                    onClick={()=>{
                      const roll=rng(6)+1;
                      const success=roll>=4;
                      setEncounter(e=>({...e,phase:'result',roll,success}));
                    }}>
                    Attempt to loot the body
                  </button>
                  <button className="btn" style={{padding:'10px'}} onClick={()=>{markDone();transition('exploring');}}>
                    Leave it
                  </button>
                </div>
              )}
            </div>
          );

          if(phase==='result') {
            const roll = encounter.roll;
            const success = encounter.success;
            const reward = poi.goodReward;
            const badEff = poi.badEffect;

            const handleContinue = () => {
              if(success){
                if(reward==='WATER_AMBUSH'||reward==='SKELETON_FIGHT') {
                  markDone(); transition('exploring');
                } else if(reward==='SPREAD_WATER'||reward==='SPREAD_ROT'||reward==='SPREAD_HELL') {
                  const biomeKey=reward==='SPREAD_WATER'?'water':reward==='SPREAD_ROT'?'rot':'hell';
                  setDungeon(prev=>{
                    const g=spreadBiome(prev.grid,prev.pos.x,prev.pos.y,biomeKey,prev.w,prev.h);
                    return {...prev,grid:g};
                  });
                  log('POI: '+biomeKey+' spreads to adjacent tiles.',{urgent:true});
                  markDone(); transition('exploring');
                } else if(reward==='STAT_BUFF') {
                  const stats=['armor','maxHp','damage','focusMax'];
                  const s=stats[rng(stats.length)];
                  const buffTrinket={id:Math.random().toString(36).slice(2),type:'trinket',rarity:'Normal',
                    name:'Spore Mutation',stats:{armor:0,maxHp:0,damage:0,focusMax:0,[s]:s==='maxHp'?2:1},
                    desc:'+1 '+s};
                  acquireItem(buffTrinket,()=>{ log('Mutation: +1 '+s+' permanently.',{urgent:true}); transition('exploring'); });
                  markDone(); return;
                } else if(reward==='FIRE_WEAPON') {
                  setPlayer(p=>{
                    const ws=[...p.weapons];
                    if(ws[0]) ws[0]={...ws[0],dmgTags:ws[0].dmgTags.map(()=>'fire')};
                    return{...p,weapons:ws};
                  });
                  log('POI: Weapon imbued with fire.',{urgent:true});
                  markDone(); transition('exploring');
                } else if(reward==='FULL_HEAL') {
                  setPlayer(p=>({...p,hp:derived.maxHp}));
                  log('POI: Fully healed.',{urgent:true});
                  markDone(); transition('exploring');
                } else if(reward==='REPAIR_ALL') {
                  setPlayer(p=>({...p,weapons:p.weapons.map(w=>w?{...w,dur:w.maxDur}:w)}));
                  log('POI: All weapons repaired.',{urgent:true});
                  markDone(); transition('exploring');
                } else if(reward==='REVEAL_ADJ') {
                  setDungeon(prev=>{
                    const g=prev.grid.map(r=>[...r]);
                    const {x,y}=prev.pos;
                    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny])=>{
                      if(g[ny]&&g[ny][nx]) g[ny][nx]={...g[ny][nx],visited:true};
                    });
                    return {...prev,grid:g};
                  });
                  log('POI: Adjacent rooms revealed.',{urgent:true});
                  markDone(); transition('exploring');
                } else if(reward==='GHOST_LOOT') {
                  const dr3 = poi._deathRecord || deathRecord.current;
                  if(dr3){
                    const items=[
                      ...((dr3.weapons||[]).filter(Boolean).slice(0,2).map(w=>({...w,type:'weapon'}))),
                      ...((dr3.trinkets||[]).filter(Boolean).slice(0,2)),
                    ].filter(Boolean);
                    markDone();
                    deathRecord.current=null; 
                    if(items.length>0){
                      setGhostLootPick({items,onPick:(item)=>{
                        acquireItem(item,()=>{ setGhostLootPick(null); transition('exploring'); });
                      }});
                      setGs('ghost_loot');
                    } else transition('exploring');
                  } else { markDone(); transition('exploring'); }
                  return;
                } else if(reward==='WEAPON_DROP'||reward==='BODY_LOOT') {
                  const drop={...BASE_WEAPON_POOL[rng(BASE_WEAPON_POOL.length)],type:'weapon'};
                  markDone();
                  setLootQueue([drop]); setPostLoot('exploring'); transition('loot');
                } else if(reward==='NORMAL_TRINKET') {
                  const trinket=generateTrinket('Normal');
                  markDone();
                  setLootQueue([trinket]); setPostLoot('exploring'); transition('loot');
                }
              } else {
                if(badEff==='DAMAGE_3') {
                  setPlayer(p=>({...p,hp:Math.max(1,p.hp-3)}));
                  log('POI: Took 3 damage.',{bad:true});
                } else if(badEff==='DAMAGE_2') {
                  setPlayer(p=>({...p,hp:Math.max(1,p.hp-2)}));
                  log('POI: Took 2 damage.',{bad:true});
                } else if(badEff==='WEAPON_DAMAGE') {
                  setPlayer(p=>{const ws=[...p.weapons];if(ws[0])ws[0]={...ws[0],dur:Math.max(0,ws[0].dur-3)};return{...p,weapons:ws};});
                  log('POI: Active weapon damaged.',{bad:true});
                } else if(badEff==='ARMORDOWN') {
                  setPlayer(p=>({...p,armorDebuff:p.armorDebuff+1}));
                  log('POI: Armor reduced.',{bad:true});
                } else if(badEff==='DAMAGE_4') {
                  setPlayer(p=>({...p,hp:Math.max(1,p.hp-4)}));
                  log('POI: Took 4 damage.',{bad:true});
                } else if(badEff==='SKELETON_FIGHT') {
                  const skele=DUNGEON_MONSTERS.find(m=>m.id==='skeleton');
                  const hp=skele.hpBase+dungeon.floor*3+rng(3);
                  setEncounter({...skele,hp,maxHp:hp,damage:skele.dmgBase+dungeon.floor,isBoss:false,poiWin:'BODY_LOOT'});
                  setIsPlayerTurn(true);
                  setGs('combat');
                  log('The body rises! Fight!',{bad:true,urgent:true});
                  return;
                } else if(badEff==='GHOST_FIGHT') {
                  const dr2 = poi._deathRecord || deathRecord.current;
                  if(dr2) {
                    const ghostWeapon = dr2.weapons[0] || STARTING_WEAPON;
                    const ghostArmor  = Math.floor((dr2.baseArmor||0)/2);
                    const ghostHp     = Math.max(8, dr2.hp + dungeon.floor*2);
                    const ghostDmg    = Math.max(2, (ghostWeapon.dmgBonus||0) + Math.ceil(getLevel(dr2.xp||0)/2));
                    const ghostEnc = {
                      id:'ghost',
                      name:'Echo of '+dr2.className,
                      hp:ghostHp, maxHp:ghostHp,
                      damage:ghostDmg,
                      diceType: ghostWeapon.diceType||6,
                      isBoss:false,
                      isGhost:true,
                      ghostArmor,
                      ghostWeapon,
                      _deathRecord: dr2,
                      poiWin:'GHOST_LOOT',
                      weak:[], resist:[],
                    };
                    ENEMY_AFFINITIES['ghost'] = {weak:[],resist:[]};
                    setEncounter(ghostEnc);
                    setIsPlayerTurn(true);
                    setGs('combat');
                    log('The echo of '+dr2.className+' rises!',{bad:true,urgent:true});
                  } else {
                    markDone(); transition('exploring');
                  }
                  return;
                } else if(badEff==='WATER_AMBUSH') {
                  const waterPool=WATER_MONSTERS.filter(m=>m.minFloor<=dungeon.floor);
                  const wm=waterPool[rng(waterPool.length)]||WATER_MONSTERS[0];
                  const whp=wm.hpBase+dungeon.floor*3+rng(3);
                  setEncounter({...wm,hp:whp,maxHp:whp,damage:wm.dmgBase+dungeon.floor,isBoss:false});
                  setIsPlayerTurn(false);
                  setGs('combat');
                  log('Something surfaces! Ambush!',{bad:true,urgent:true});
                  setTimeout(()=>setEncounter(e=>{doMonsterAttack(e);return e;}),900);
                  return;
                }
                markDone(); transition('exploring');
              }
            };

            return (
              <div style={{display:'flex',flexDirection:'column',gap:14}} className="anim-fade">
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:16,padding:'16px 0'}}>
                  <div style={{
                    width:52,height:52,
                    border:'1px solid '+(success?'#3a5a3a':'#5a2020'),
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:24,fontWeight:'bold',
                    color:success?'#60a060':'#c05050',
                  }}>{roll}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:4}}>
                    <div style={{fontSize:11,letterSpacing:'0.08em',color:success?'#60a060':'#c05050',textTransform:'uppercase'}}>
                      {success?'Success':'Failed'}
                    </div>
                    <div style={{fontSize:8,color:'#2a2a2a',textTransform:'uppercase',letterSpacing:'0.1em',maxWidth:160,lineHeight:1.7}}>
                      {success?poi.goodLabel:poi.badLabel}
                    </div>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={handleContinue} style={{padding:'13px',gap:8}}>
                  <IArrow size={12}/> Continue
                </button>
              </div>
            );
          }
          return null;
        })()}

        {type==='TRAP'&&trapRoll&&<div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:16,padding:'20px 0'}}>
            <div style={{width:52,height:52,border:'1px solid '+(trapRoll.roll>=4?'#3a5a3a':'#5a3a2a'),display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:'bold',color:trapRoll.roll>=4?'#609060':'#b06040'}}>{trapRoll.roll}</div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <div style={{fontSize:10,letterSpacing:'0.12em',color:trapRoll.roll>=4?'#608060':'#b06040',textTransform:'uppercase'}}>{trapRoll.roll>=4?'Success':'Partial'}</div>
              <div style={{fontSize:8,letterSpacing:'0.1em',color:'#2a2a2a',textTransform:'uppercase'}}>{trapRoll.roll>=4?'Trap avoided.':'-1 HP'}</div>
            </div>
          </div>
          <button className="btn btn-primary" onClick={()=>resolveEvent('confirm_trap_roll')} style={{padding:'13px'}}><IArrow size={12}/> Continue</button>
        </div>}
      </div>
    ,true);
  }

  if(gs==='loot'&&lootQueue.length>0){
    const item=lootQueue[0];const isWeapon=item.type==='weapon';
    return shell(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,gap:18}} className="anim-fade">
        <div style={{fontSize:8,letterSpacing:'0.25em',color:'#222',textTransform:'uppercase'}}>{isWeapon?'Weapon found':'Relic found'}</div>
        <div style={{border:'1px solid '+(isWeapon?'#252525':'#3a2a08'),padding:20,width:'100%',display:'flex',flexDirection:'column',gap:8}}>
          <div style={{fontSize:13,letterSpacing:'0.08em',color:isWeapon?'#777':'#b09030'}}>{item.name}</div>
          <div style={{fontSize:8,color:'#252525',letterSpacing:'0.1em',textTransform:'uppercase'}}>{item.desc}</div>
          {item.type==='trinket'&&<div style={{marginTop:6,paddingTop:8,borderTop:'1px solid #141414',display:'flex',flexDirection:'column',gap:4}}>
            {Object.entries(item.stats).filter(([,v])=>v>0).map(([k,v])=>(<div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:8,letterSpacing:'0.1em',color:'#333',textTransform:'uppercase'}}><span>{k}</span><span style={{color:'#555'}}>+{v}</span></div>))}
          </div>}
        </div>
        <div style={{display:'flex',gap:6,width:'100%'}}>
          <button className="btn btn-primary" onClick={()=>takeLoot(item)} style={{flex:1,gap:6,padding:'12px'}}><ICheck size={12}/> Take</button>
          <button className="btn" onClick={skipLoot} style={{flex:1,padding:'12px'}}>Leave</button>
        </div>
        {lootQueue.length>1&&<div style={{fontSize:7,color:'#1a1a1a',letterSpacing:'0.1em',textTransform:'uppercase'}}>{lootQueue.length-1} more...</div>}
      </div>
    ,true);
  }

  // ── GHOST LOOT ────────────────────────────────────────────────────────────
  if(gs==='ghost_loot'&&ghostLootPick){
    return shell(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,gap:16}} className="anim-fade">
        <div style={{fontSize:8,letterSpacing:'0.25em',color:'#5a2020',textTransform:'uppercase'}}>Reclaim your past</div>
        <div className="cinzel" style={{fontSize:16,color:'#c06060',textAlign:'center'}}>Choose one item to salvage</div>
        <div style={{display:'flex',flexDirection:'column',gap:8,width:'100%',marginTop:10}}>
          {ghostLootPick.items.map((item,i)=>(
            <button key={i} className="btn" onClick={()=>ghostLootPick.onPick(item)} style={{flexDirection:'column',alignItems:'flex-start',padding:'12px',gap:4}}>
              <div style={{fontSize:12,color:item.type==='weapon'?'#888':'#a08030'}}>{item.name}</div>
              <div style={{fontSize:8,color:'#555',textTransform:'uppercase'}}>{item.desc}</div>
            </button>
          ))}
          <button className="btn" onClick={()=>{setGhostLootPick(null); transition('exploring');}} style={{padding:'12px',marginTop:8}}>Leave it all</button>
        </div>
      </div>
    ,true);
  }

  // ── TRANSITIONS ───────────────────────────────────────────────────────────
  if(gs==='area_transition')return shell(
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:28}} className="anim-fade">
      <div style={{fontSize:8,letterSpacing:'0.25em',color:'#2a2a2a',textTransform:'uppercase'}}>Area cleared</div>
      <div className="cinzel" style={{fontSize:20,color:'#555',letterSpacing:'0.06em'}}>Deeper still</div>
      <button className="btn btn-primary" onClick={()=>{const d=dungeon;makeGrid(d.floor,2,d.w,d.h);transition('exploring');}} style={{gap:8,padding:'12px 22px',marginTop:8}}><IArrow size={13}/> Continue</button>
    </div>
  ,true);

  if(gs==='floor_transition')return shell(
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:28}} className="anim-fade">
      <div style={{fontSize:8,color:'#1e1e1e',letterSpacing:'0.25em',textTransform:'uppercase'}}>Floor cleared</div>
      <div className="cinzel" style={{fontSize:22,color:'#666',letterSpacing:'0.06em'}}>Floor {dungeon.floor+1}</div>
      <div style={{fontSize:8,color:'#181818',letterSpacing:'0.15em',textTransform:'uppercase',textAlign:'center',lineHeight:2.2}}>The dungeon grows darker.<br/>Enemies grow stronger.</div>
      <button className="btn btn-primary" onClick={descend} style={{gap:8,padding:'12px 22px',marginTop:8}}><IArrow size={13}/> Descend</button>
    </div>
  ,true);

  if(gs==='game_over')return(
    <div style={{position:'fixed',inset:0,background:'#080808',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:28,maxWidth:480,margin:'0 auto'}} className="anim-fade">
      <div style={{fontSize:8,letterSpacing:'0.25em',color:'#3a1a1a',textTransform:'uppercase'}}>You have fallen</div>
      <div className="cinzel" style={{fontSize:28,color:'#5a2a2a',letterSpacing:'0.06em'}}>Defeated</div>
      <div style={{fontSize:9,color:'#252525',letterSpacing:'0.12em',textTransform:'uppercase',textAlign:'center',lineHeight:2.4,marginTop:6}}>Floor {dungeon.floor} / Level {getLevel(player?.xp||0)}<br/>{player?.gold||0} gold / {player?.xp||0} xp</div>
      <div style={{width:'100%',borderTop:'1px solid #141414',marginTop:6,marginBottom:6}}/>
      <div style={{fontSize:8,color:'#181818',letterSpacing:'0.1em',textTransform:'uppercase',width:'100%',textAlign:'center',lineHeight:2}}>{logs.slice(-5).map((l,i)=><div key={i}>{l.text}</div>)}</div>
      <button className="btn btn-primary" onClick={()=>{setGs('menu');setPlayer(null);setLogs([]);setCampMode(false);setChestResult(null);setSwapOverlay(null);setPendingAttack(null);setLootQueue([]);setGhostLootPick(null);}} style={{gap:8,padding:'12px 22px',marginTop:6}}>Try again</button>
    </div>
  );

  if(gs==='victory')return(
    <div style={{position:'fixed',inset:0,background:'#080808',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:28,maxWidth:480,margin:'0 auto'}} className="anim-fade">
      <div style={{fontSize:8,letterSpacing:'0.25em',color:'#2a3a2a',textTransform:'uppercase'}}>The dungeon is cleared</div>
      <div className="cinzel" style={{fontSize:28,color:'#5a7a4a',letterSpacing:'0.06em'}}>Victory</div>
      <div style={{fontSize:9,color:'#222',letterSpacing:'0.12em',textTransform:'uppercase',textAlign:'center',lineHeight:2.4,marginTop:6}}>{player?.gold||0} gold recovered<br/>Level {getLevel(player?.xp||0)} / {player?.xp||0} xp</div>
      <button className="btn btn-primary" onClick={()=>{setGs('menu');setPlayer(null);setLogs([]);setCampMode(false);setChestResult(null);setSwapOverlay(null);setPendingAttack(null);setLootQueue([]);setGhostLootPick(null);}} style={{gap:8,padding:'12px 22px',marginTop:14}}>Descend again</button>
    </div>
  );

  return shell(<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#181818',letterSpacing:'0.15em',textTransform:'uppercase'}}>Loading...</div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
