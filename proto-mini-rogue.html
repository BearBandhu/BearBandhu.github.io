<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Rogue</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body, #root { height:100%; width:100%; overflow:hidden; }
    body { background:#080808; color:#c8c8c8; font-family:'Share Tech Mono',monospace; -webkit-tap-highlight-color:transparent; user-select:none; }
    .cinzel { font-family:'Cinzel',serif; }
    ::-webkit-scrollbar { width:2px; }
    ::-webkit-scrollbar-track { background:#080808; }
    ::-webkit-scrollbar-thumb { background:#2a2a2a; }
    @keyframes fadeIn    { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
    @keyframes pulse     { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    @keyframes diceAnim  { 0%{transform:scale(1.2) rotate(-5deg);} 50%{transform:scale(0.9) rotate(5deg);} 100%{transform:scale(1) rotate(0);} }
    @keyframes overlayIn { from{opacity:0;transform:scale(0.97);} to{opacity:1;transform:scale(1);} }
    @keyframes levelGlow { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
    .anim-fade    { animation:fadeIn 0.3s ease forwards; }
    .anim-pulse   { animation:pulse 1.2s ease infinite; }
    .anim-dice    { animation:diceAnim 0.12s ease; }
    .anim-overlay { animation:overlayIn 0.2s ease forwards; }
    .anim-glow    { animation:levelGlow 1.4s ease infinite; }
    .btn { display:flex; align-items:center; justify-content:center; border:1px solid #252525; background:transparent; color:#909090; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; padding:10px 14px; cursor:pointer; transition:border-color 0.15s,color 0.15s,background 0.15s; -webkit-tap-highlight-color:transparent; }
    .btn:hover,.btn:active { border-color:#555; color:#ddd; background:rgba(255,255,255,0.03); }
    .btn:disabled { opacity:0.25; pointer-events:none; }
    .btn-primary { border-color:#777; color:#ccc; }
    .btn-primary:hover,.btn-primary:active { border-color:#aaa; color:#fff; background:rgba(255,255,255,0.04); }
    .btn-danger  { border-color:#4a1a1a; color:#b05050; }
    .btn-danger:hover { border-color:#b05050; color:#d07070; }
    .btn-amber   { border-color:#4a3a10; color:#a08030; }
    .btn-amber:hover { border-color:#a08030; color:#c0a040; }
    .btn-green   { border-color:#1a3a1a; color:#508050; }
    .btn-green:hover { border-color:#508050; color:#70a070; }
    .hp-bar-track { background:#111; height:2px; width:100%; }
    .hp-bar-fill  { background:#666; height:2px; transition:width 0.4s ease; }
    .hp-bar-fill.low  { background:#7a3333; }
    .hp-bar-fill.boss { background:#6a4020; }
    @keyframes hitFlash  { 0%{opacity:1;} 30%{opacity:0.3;} 100%{opacity:1;} }
    @keyframes knockout  { 0%{opacity:1;transform:scale(1);} 40%{opacity:0.8;transform:scale(1.1) rotate(-3deg);} 100%{opacity:0.2;transform:scale(0.85) rotate(5deg);} }
    .knocked { animation:knockout 0.4s ease forwards; }
    .hit-flash { animation:hitFlash 0.4s ease; }
  </style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Icons ─────────────────────────────────────────────────────────────────────

const ILeaf    = p=><Ico {...p} d='<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>'/>;

const FlatPortrait = ({icon: Icon, color='#505050', hit=false, bg=null, size=52}) => {
  const c = hit ? '#c06060' : color;
  return (
    <div style={{
      width:'100%', height:'100%',
      display:'flex', alignItems:'center', justifyContent:'center',
      position:'relative',
    }}>
      <div style={{
        position:'absolute', width:80, height:80, borderRadius:'50%',
        border:'1px solid '+(hit?'#c06060':(bg||color)), opacity:0.12,
      }}/>
      <span style={{color:c, transition:'color 0.25s', display:'flex'}}>
        <Icon size={size} stroke={1.2}/>
      </span>
    </div>
  );
};

// ── Player class portraits ────────────────────────────────────────────────────
const PortraitCrusader  = ({hit=false}) => <FlatPortrait icon={IShield} color="#707070" hit={hit}/>;

// ── Enemy portraits ───────────────────────────────────────────────────────────
// Dungeon biome

const PortraitGoblin   = ({hit=false}) => <FlatPortrait icon={ISkull}   color="#6a5a3a" hit={hit}/>;
const PortraitSpider   = ({hit=false}) => <FlatPortrait icon={IAlert}   color="#5a5a5a" hit={hit}/>;
const PortraitSkeleton = ({hit=false}) => <FlatPortrait icon={ISword}   color="#6a6a6a" hit={hit}/>;
const PortraitBoss     = ({hit=false}) => <FlatPortrait icon={ICrown}   color="#a07030" hit={hit} size={56}/>;

// ── Merchant portrait (animated) ─────────────────────────────────────────────
const PortraitMerchant = ({mood='idle'}) => {
  const [frame, setFrame] = React.useState(0);
  const [showCoin, setShowCoin] = React.useState(false);

  React.useEffect(()=>{
    const t = setInterval(()=>setFrame(f=>(f+1)%80),80);
    return()=>clearInterval(t);
  },[]);

  React.useEffect(()=>{
    if(frame===0&&mood==='idle'){ setShowCoin(true); setTimeout(()=>setShowCoin(false),1600); }
  },[frame]);

  const dialogs = {
    idle:     ["Wares for the weary...", "Gold speaks louder.", "What'll it be?", "Finest goods around."],
    browsing: ["Take your time.", "Quality guaranteed.", "Everything has a price.", "The best, for the bold."],
    bought:   ["Pleasure doing business.", "A wise investment.", "Come back anytime.", "May it serve you well."],
    left:     ["Bah. Next time.", "Your loss.", "The offer stands.", "Safe travels... maybe."],
  };
  const dlg = dialogs[mood]||dialogs.idle;
  const line = dlg[Math.floor(frame/40)%dlg.length];
  const color = mood==='left'?'#444':mood==='bought'?'#508050':'#505050';
  const coinY = showCoin ? Math.max(20, 40 - Math.abs(Math.sin(frame*0.25))*28) : 40;

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:'100%',gap:8}}>
      <div style={{position:'relative',width:80,height:80,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{position:'absolute',width:72,height:72,borderRadius:'50%',border:'1px solid '+color,opacity:0.15}}/>
        <span style={{color,transition:'color 0.4s',display:'flex'}}><IShop size={48} stroke={1.2}/></span>
        {showCoin && (
          <div style={{
            position:'absolute', top:coinY-8, right:8,
            width:10,height:10,borderRadius:'50%',
            border:'1px solid #a08030',
            transition:'top 0.05s linear',
          }}/>
        )}
      </div>
      <div style={{
        padding:'5px 10px', border:'1px solid #1a1a1a',
        fontSize:8, letterSpacing:'0.1em', color:mood==='bought'?'#2a3a2a':mood==='left'?'#3a2a2a':'#2a2a2a',
        textTransform:'uppercase', textAlign:'center', minHeight:24,
        transition:'color 0.3s', width:'100%',
      }}>
        {line}
      </div>
    </div>
  );
};

// ── Constants ─────────────────────────────────────────────────────────────────
const CLASSES = [

const resolveDamage = (dice, weapon, abilityOverrideTag, enemyId, dmgBonus) => {
  const aff = ENEMY_AFFINITIES[enemyId] || { weak:[], resist:[] };
  let total = 0;
  const results = dice.map((d, i) => {
    if(d.result === 1) return { result:1, finalResult:0, tag: abilityOverrideTag || weapon.dmgTags?.[i] || weapon.dmgTags?.[0] || 'slashing', modified:null };
    const tag = abilityOverrideTag || weapon.dmgTags?.[i] || weapon.dmgTags?.[0] || 'slashing';
    let fr = d.result;
    let modified = null;
    if(aff.weak.includes(tag)) {
      modified = 'weak';
    }
    if(aff.resist.includes(tag)) {
      fr = Math.floor(fr / 2);
      modified = 'resist';
    }
    total += fr;
    return { result: d.result, finalResult: fr, tag, modified };
  });
  total = total > 0 ? total + (dmgBonus||0) : 0;
  return { totalDmg: total, diceResults: results };
};

  const total = w.reduce((a,b)=>a+b,0);

};

const generateBiomeGrid = (w, h, floor) => {
  const biomeMap = Array.from({length:h},()=>Array.from({length:w},()=>'dungeon'));
  if(floor===1) return biomeMap;
  const weights = FLOOR_BIOME_WEIGHTS[Math.min(floor,8)]||FLOOR_BIOME_WEIGHTS[8];
  const nonDungeonChance = (100-weights[0])/100;
  const numSeeds = Math.floor(Math.random()*3)+1;
  for(let s=0;s<numSeeds;s++){
    const biome = rollBiome(floor);
    if(biome==='dungeon') continue;
    const sx = rng(w), sy = rng(h);
    const radius = rng(3)+2; 
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const dist = Math.abs(x-sx)+Math.abs(y-sy);
      if(dist<=radius){
        const prob = (1-(dist/radius))*nonDungeonChance*1.5;
        if(Math.random()<prob) biomeMap[y][x]=biome;
      }
    }
  }
  return biomeMap;
};

const spreadBiome = (grid, cx, cy, biome, w, h) => {
  const radius = rng(3)+2; 
  const newGrid = grid.map(r=>[...r]);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dist = Math.abs(x-cx)+Math.abs(y-cy);
    if(dist>0&&dist<=radius&&Math.random()<0.7){
      newGrid[y][x] = {...newGrid[y][x], biome};
    }
  }
  return newGrid;
};

const generateTrinket = (rarity='Normal') => {
  const types=['armor','maxHp','damage','focusMax'];
  const stats={armor:0,maxHp:0,damage:0,focusMax:0};
  const picks=rarity==='Rare'?2:1, val=rarity==='Rare'?2:1;
  for(let i=0;i<picks;i++){const s=types[rng(types.length)];stats[s]+=s==='maxHp'?val*2:val;}
  const names={Normal:['Worn Talisman','Stone Charm','Ashen Ring','Cracked Seal','Dust Relic'],Rare:['Gilded Rune','Shard of Fate','Blood Opal','Voidstone','Warden Mark']};
  return { id:Math.random().toString(36).slice(2), type:'trinket', rarity, name:names[rarity][rng(names[rarity].length)], stats,
    desc:Object.entries(stats).filter(([,v])=>v>0).map(([k,v])=>'+'+v+' '+k).join(' / ') };
};
