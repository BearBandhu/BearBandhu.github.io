<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonar Salvage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-dark: #020a02;
            --neon-green: #00FF41;
            --dim-green: #004411;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0c100c; /* Deep shadow outside terminal */
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh; 
            touch-action: none;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            max-height: 98dvh;
            background: linear-gradient(135deg, #3a403a, #1a1e1a);
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px 15px 15px 15px; 
            gap: 15px; 
        }

        /* Manufacturer Plate */
        #game-container::before {
            content: "DEEP-TEK // MODEL 4A SALVAGE TERMINAL";
            position: absolute;
            top: -12px;
            left: 20px;
            font-size: 11px;
            color: #000;
            font-weight: bold;
            background: #889988;
            padding: 2px 8px;
            border-radius: 2px;
            border: 2px solid #111;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
            letter-spacing: 0px;
            text-shadow: none;
        }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            /* Thick CRT bezel */
            border: 20px solid #0a0a0a; 
            border-bottom-width: 30px;
            border-radius: 16px 16px 24px 24px; 
            background: var(--bg-dark);
            box-shadow: inset 0 0 30px #000, 0 5px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Scanline Overlay */
        #canvas-wrapper::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 4px 4px; /* Finer grid for the CRT feel */
            pointer-events: none;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8); /* Screen vignette */
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
        }

        #hardware-gauges {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 15px;
            background: linear-gradient(to right, #1a1e1a, #2a2e2a, #1a1e1a);
            border-bottom: 2px solid #000;
            border-top: 2px solid #000;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
        }

        .gauge-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 140px;
        }

        .debug-btn {
            font-size: 11px;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 65, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0, 255, 65, 0.2);
            transition: all 0.1s;
        }

        .debug-btn.active {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .gauge-label {
            font-size: 13px;
            color: #8fa88f;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 #000;
        }

        .gauge-container {
            flex: 1;
            height: 14px;
            background: #050805;
            border: 2px solid #111;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            width: 100%;
            background-color: var(--neon-green);
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5), 0 0 10px var(--neon-green);
            border-radius: 4px;
            /* Smoothly animate width and color changes */
            transition: background-color 0.1s, box-shadow 0.1s;
        }

        #controls {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: linear-gradient(to bottom, #222622, #111511);
            border: 2px solid #000;
            border-top: 3px solid #333933;
            border-radius: 8px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
        }

        .d-pad, .action-pad {
            display: grid;
            gap: 8px;
        }

        .d-pad {
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(2, 45px);
        }

        .btn {
            background: linear-gradient(to bottom, #4a544a, #2c332c);
            color: #8fa88f;
            border: 2px solid #0a0c0a;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #0a0c0a, inset 0 2px 2px rgba(255,255,255,0.1);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.05s, box-shadow 0.05s, color 0.05s;
        }

        .btn:active, .btn.active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #0a0c0a, inset 0 3px 5px rgba(0,0,0,0.8);
            background: #2a332a;
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-down { grid-column: 2; grid-row: 2; }

        .action-pad {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        #btn-grab {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #a03030, #601010);
            color: #ffcccc;
            border: 2px solid #200000;
            box-shadow: 0 8px 0 #1a0000, inset 0 2px 5px rgba(255,255,255,0.3);
            font-size: 15px;
        }

        #btn-grab:active, #btn-grab.active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #1a0000, inset 0 4px 8px rgba(0,0,0,0.8);
            background: #801010;
            color: #fff;
            text-shadow: 0 0 10px #ff0000;
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 10, 2, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            z-index: 10;
        }

        #start-screen p {
            font-size: 14px;
            margin: 10px 0;
            color: #aaa;
        }

        .blink {
            animation: blinker 1.5s step-start infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        #debug-menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(2, 15, 2, 0.95);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 15px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        #debug-menu h3 {
            margin: 0 0 15px 0;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 5px;
            text-align: center;
            font-size: 16px;
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .slider-row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #8fa88f;
        }

        .slider-row span {
            color: var(--neon-green);
            font-weight: bold;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            background: var(--neon-green);
            cursor: pointer;
            border-radius: 3px;
            margin-top: -7px;
            box-shadow: 0 0 5px #000;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: var(--dim-green);
            border-radius: 2px;
        }

        #debug-toggles {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .debug-action-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            padding: 8px;
            cursor: pointer;
            flex: 1;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .debug-action-btn:active, .debug-action-btn.active {
            background: var(--neon-green);
            color: #000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hardware-gauges">
            <button class="debug-btn" id="btn-debug">OPTICS OVR</button>
            <div class="gauge-wrapper">
                <div class="gauge-label">PWR</div>
                <div class="gauge-container">
                    <div class="gauge-fill" id="battery-fill"></div>
                </div>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="256" height="256"></canvas>
            
            <div id="start-screen">
                <h2 style="margin-bottom: 5px; color: var(--neon-green);">TARGET DETECTED</h2>
                <p>Descend into the trench.</p>
                <p style="color: #FF4444;">WARNING: HITTING ROCKS<br>WILL DROP SALVAGE</p>
                <p>Trolley: Left/Right<br>Winch: Up/Down<br>Claw: Space / Button</p>
                <h3 class="blink" style="margin-top: 15px; cursor: pointer; border: 1px solid #00FF41; padding: 10px; color: var(--neon-green);" id="start-btn">INITIALIZE SYSTEM</h3>
            </div>

            <div id="debug-menu">
                <h3>OPTICS CONFIGURATION</h3>
                <div class="slider-row">
                    <label>AMBIENT RADIUS <span><span id="val-ambient">45</span>px</span></label>
                    <input type="range" id="sl-ambient" min="0" max="200" value="45">
                </div>
                <div class="slider-row">
                    <label>CONE LENGTH <span><span id="val-length">350</span>px</span></label>
                    <input type="range" id="sl-length" min="50" max="800" value="350">
                </div>
                <div class="slider-row">
                    <label>CONE WIDTH <span><span id="val-width">51</span>&deg;</span></label>
                    <input type="range" id="sl-width" min="10" max="180" value="51">
                </div>
                <div id="debug-toggles">
                    <button class="debug-action-btn" id="btn-toggle-mask">DISABLE MASK</button>
                    <button class="debug-action-btn" id="btn-close-debug">CLOSE MENU</button>
                </div>
            </div>
        </div>
        
        <div id="controls">
            <div class="d-pad">
                <div class="btn" id="btn-up">▲</div>
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-down">▼</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="action-pad">
                <div class="btn" id="btn-grab">ACTIVATE</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const batteryFill = document.getElementById('battery-fill');
        const btnDebug = document.getElementById('btn-debug');

        // Setup Offscreen mask canvas for the lighting system
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = 256;
        maskCanvas.height = 256;
        const maskCtx = maskCanvas.getContext('2d');

        const COLOR_BG = '#020a02';
        const COLOR_NEON = '#00FF41';
        const COLOR_DARK = '#004411';

        // Tripled depth
        const WORLD_HEIGHT = 2400; 
        let cameraY = 0;
        
        let debugState = { ambient: 45, length: 350, width: 51, disableMask: false };

        let audioCtx;
        const keys = { left: false, right: false, up: false, down: false, grab: false };

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let lastTime = 0;
        let obstacles = [];

        // Battery logic
        const BATTERY_MAX = 120; // 2 minutes in seconds
        let battery = BATTERY_MAX;

        const boat = {
            y: 25,
            width: 220,
            height: 12
        };

        const trolley = {
            x: 128,
            y: 25,
            width: 24,
            height: 10,
            speed: 90
        };

        const crane = {
            length: 40,       
            minLength: 20,
            maxLength: WORLD_HEIGHT - 60,
            speed: 70,        
            clawX: 128,
            clawY: 65,
            vx: 0,
            vy: 0,
            isOpen: true
        };

        const targetObject = {
            x: 0,
            y: WORLD_HEIGHT - 25,
            size: 16,
            isGrabbed: false,
            vy: 0
        };

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.warn("Audio not supported");
                }
            }
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playGrabSound() { playTone(300, 'square', 0.15); playTone(400, 'square', 0.15); }
        function playMissSound() { playTone(100, 'sawtooth', 0.3); }
        function playImpactSound() { playTone(80, 'square', 0.1, 0.2); }
        function playScoreSound() { 
            playTone(600, 'sine', 0.1); 
            setTimeout(() => playTone(800, 'sine', 0.15), 100);
            setTimeout(() => playTone(1200, 'sine', 0.3), 200);
        }

        function generateObstacles() {
            obstacles = [];
            let y = 150;
            
            // Generate cavern walls until 250px above the floor
            // This guarantees the package will never be covered by a rock.
            while (y < WORLD_HEIGHT - 250) {
                let gapSize = 80 + Math.random() * 40; 
                let gapCenter = 60 + Math.random() * (canvas.width - 120);
                let height = 40 + Math.random() * 80;

                // Left rock formation
                obstacles.push({
                    x: 0,
                    y: y,
                    w: gapCenter - gapSize / 2,
                    h: height
                });

                // Right rock formation
                obstacles.push({
                    x: gapCenter + gapSize / 2,
                    y: y,
                    w: canvas.width - (gapCenter + gapSize / 2),
                    h: height
                });

                y += height + 80 + Math.random() * 80; 
            }
        }

        function spawnObject() {
            targetObject.x = 40 + Math.random() * (canvas.width - 80);
            targetObject.y = WORLD_HEIGHT - 25;
            targetObject.isGrabbed = false;
            targetObject.vy = 0;
        }

        function toggleClaw() {
            crane.isOpen = !crane.isOpen;
            
            if (!crane.isOpen) {
                const hitBoxX = Math.abs(crane.clawX - targetObject.x) < 18;
                const hitBoxY = Math.abs(crane.clawY - targetObject.y) < 16;
                
                if (hitBoxX && hitBoxY && !targetObject.isGrabbed) {
                    targetObject.isGrabbed = true;
                    playGrabSound();
                } else {
                    playMissSound();
                }
            } else {
                if (targetObject.isGrabbed) {
                    targetObject.isGrabbed = false;
                    if (crane.clawY <= crane.minLength + 30) {
                        score++;
                        playScoreSound();
                        spawnObject();
                    } else {
                        targetObject.y = 225; 
                    }
                }
            }
        }

        function handleKeyDown(e) {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                if (e.code === 'Space' || e.code === 'Enter') startGame();
                return;
            }
            if (gameState !== 'PLAYING') return;
            
            switch(e.code) {
                case 'ArrowLeft': keys.left = true; break;
                case 'ArrowRight': keys.right = true; break;
                case 'ArrowUp': keys.up = true; break;
                case 'ArrowDown': keys.down = true; break;
                case 'Space': 
                    if (!keys.grab) { keys.grab = true; toggleClaw(); }
                    break;
            }
        }

        function handleKeyUp(e) {
            if (gameState !== 'PLAYING') return;
            switch(e.code) {
                case 'ArrowLeft': keys.left = false; break;
                case 'ArrowRight': keys.right = false; break;
                case 'ArrowUp': keys.up = false; break;
                case 'ArrowDown': keys.down = false; break;
                case 'Space': keys.grab = false; break;
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        function bindBtn(id, keyMap) {
            const el = document.getElementById(id);
            const press = (e) => {
                e.preventDefault();
                if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
                keys[keyMap] = true;
                el.classList.add('active');
                if (keyMap === 'grab' && gameState === 'PLAYING') {
                    if(!el.dataset.held) {
                        toggleClaw();
                        el.dataset.held = true;
                    }
                }
            };
            const release = (e) => {
                e.preventDefault();
                keys[keyMap] = false;
                el.classList.remove('active');
                if (keyMap === 'grab') el.dataset.held = "";
            };

            el.addEventListener('touchstart', press, {passive: false});
            el.addEventListener('touchend', release, {passive: false});
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-up', 'up');
        bindBtn('btn-down', 'down');
        bindBtn('btn-grab', 'grab');

        const debugMenu = document.getElementById('debug-menu');
        const slAmbient = document.getElementById('sl-ambient');
        const slLength = document.getElementById('sl-length');
        const slWidth = document.getElementById('sl-width');
        const valAmbient = document.getElementById('val-ambient');
        const valLength = document.getElementById('val-length');
        const valWidth = document.getElementById('val-width');
        const btnToggleMask = document.getElementById('btn-toggle-mask');
        const btnCloseDebug = document.getElementById('btn-close-debug');

        function updateDebugState() {
            debugState.ambient = parseInt(slAmbient.value);
            debugState.length = parseInt(slLength.value);
            debugState.width = parseInt(slWidth.value);
            valAmbient.innerText = debugState.ambient;
            valLength.innerText = debugState.length;
            valWidth.innerText = debugState.width;
        }

        slAmbient.addEventListener('input', updateDebugState);
        slLength.addEventListener('input', updateDebugState);
        slWidth.addEventListener('input', updateDebugState);

        btnToggleMask.addEventListener('click', () => {
            debugState.disableMask = !debugState.disableMask;
            btnToggleMask.classList.toggle('active', debugState.disableMask);
        });

        btnCloseDebug.addEventListener('click', () => {
            debugMenu.style.display = 'none';
            btnDebug.classList.remove('active');
        });

        btnDebug.addEventListener('click', () => {
            const isHidden = debugMenu.style.display === 'none' || !debugMenu.style.display;
            debugMenu.style.display = isHidden ? 'flex' : 'none';
            btnDebug.classList.toggle('active', isHidden);
        });

        function startGame() {
            if (gameState === 'PLAYING') return;
            initAudio();
            gameState = 'PLAYING';
            startScreen.style.display = 'none';
            generateObstacles();
            spawnObject();
            score = 0;
            battery = BATTERY_MAX;
            crane.length = 40;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, {passive: false});

        function update(dt) {
            // Drain battery
            battery -= dt;
            
            // Update physical battery gauge
            const ratio = Math.max(0, battery / BATTERY_MAX);
            batteryFill.style.width = `${ratio * 100}%`;
            
            // Color transition: HSL hue 120 is Green, 60 is Yellow, 0 is Red
            const hue = ratio * 120;
            batteryFill.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
            batteryFill.style.boxShadow = `inset 0 0 5px rgba(255,255,255,0.5), 0 0 10px hsl(${hue}, 100%, 50%)`;

            if (battery <= 0) {
                battery = 0;
                gameState = 'GAMEOVER';
                return;
            }

            // Trolley movement
            if (keys.left) trolley.x -= trolley.speed * dt;
            if (keys.right) trolley.x += trolley.speed * dt;
            
            const gantryHalf = boat.width / 2;
            const centerX = canvas.width / 2;
            trolley.x = Math.max(centerX - gantryHalf + 10, Math.min(centerX + gantryHalf - 10, trolley.x));

            // Winch movement
            if (keys.down) crane.length += crane.speed * dt;
            if (keys.up) crane.length -= crane.speed * dt;
            crane.length = Math.max(crane.minLength, Math.min(crane.maxLength, crane.length));

            // Claw Physics Spring
            const targetClawX = trolley.x;
            const targetClawY = trolley.y + crane.length;

            crane.vx += (targetClawX - crane.clawX) * 12 * dt;
            crane.vy += (targetClawY - crane.clawY) * 18 * dt;

            crane.vx *= 0.88; // Damping
            crane.vy *= 0.88;

            crane.clawX += crane.vx * dt;
            crane.clawY += crane.vy * dt;

            // --- ROCK COLLISION LOGIC FOR CLAW ---
            let clawHitRock = false;
            for (let obs of obstacles) {
                if (crane.clawX + 8 > obs.x && crane.clawX - 8 < obs.x + obs.w &&
                    crane.clawY + 8 > obs.y && crane.clawY - 8 < obs.y + obs.h) {
                    
                    clawHitRock = true;
                    
                    let overlapLeft = (crane.clawX + 8) - obs.x;
                    let overlapRight = (obs.x + obs.w) - (crane.clawX - 8);
                    let overlapTop = (crane.clawY + 8) - obs.y;
                    let overlapBottom = (obs.y + obs.h) - (crane.clawY - 8);

                    let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                    if (minOverlap === overlapTop) {
                        crane.clawY = obs.y - 8;
                        crane.vy *= -0.5;
                    } else if (minOverlap === overlapBottom) {
                        crane.clawY = obs.y + obs.h + 8;
                        crane.vy *= -0.5;
                    } else if (minOverlap === overlapLeft) {
                        crane.clawX = obs.x - 8;
                        crane.vx *= -0.5;
                    } else if (minOverlap === overlapRight) {
                        crane.clawX = obs.x + obs.w + 8;
                        crane.vx *= -0.5;
                    }
                }
            }

            if (clawHitRock) {
                playImpactSound();
                if (targetObject.isGrabbed) {
                    targetObject.isGrabbed = false;
                    targetObject.vy = 0;
                    playMissSound();
                }
            }

            // --- TARGET OBJECT LOGIC ---
            if (targetObject.isGrabbed) {
                targetObject.x = crane.clawX;
                targetObject.y = crane.clawY + 10;
            } else {
                targetObject.vy += 150 * dt; 
                targetObject.y += targetObject.vy * dt;

                if (targetObject.y > WORLD_HEIGHT - 20) {
                    targetObject.y = WORLD_HEIGHT - 20;
                    targetObject.vy = 0;
                }

                for (let obs of obstacles) {
                    if (targetObject.x + targetObject.size/2 > obs.x && 
                        targetObject.x - targetObject.size/2 < obs.x + obs.w &&
                        targetObject.y + targetObject.size/2 > obs.y && 
                        targetObject.y - targetObject.size/2 < obs.y + obs.h) {
                        
                        if (targetObject.vy > 0 && targetObject.y < obs.y + 10) {
                            targetObject.y = obs.y - targetObject.size/2;
                            targetObject.vy = 0;
                        } else {
                            targetObject.vy = 0;
                        }
                    }
                }
            }

            // --- CAMERA FOLLOW ---
            let targetCameraY = crane.clawY - (canvas.height / 2);
            targetCameraY = Math.max(0, Math.min(targetCameraY, WORLD_HEIGHT - canvas.height));
            cameraY += (targetCameraY - cameraY) * 4 * dt;
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();
            ctx.translate(0, -cameraY);

            // --- FOREGROUND ELEMENTS ---
            // Draw solidly without glow effects for mobile compatibility
            ctx.lineWidth = 2;

            // --- OBSTACLES (Rocks) ---
            for (let obs of obstacles) {
                ctx.fillStyle = COLOR_DARK;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                
                // Add some internal wireframe detail to rocks
                ctx.beginPath();
                ctx.moveTo(obs.x + 5, obs.y + 5);
                ctx.lineTo(obs.x + obs.w - 5, obs.y + obs.h - 5);
                ctx.stroke();
            }

            // Sea Floor (Solid block)
            ctx.fillStyle = COLOR_DARK;
            ctx.beginPath();
            ctx.moveTo(0, WORLD_HEIGHT - 10);
            ctx.lineTo(30, WORLD_HEIGHT - 5); ctx.lineTo(60, WORLD_HEIGHT - 12); ctx.lineTo(100, WORLD_HEIGHT - 2);
            ctx.lineTo(150, WORLD_HEIGHT - 10); ctx.lineTo(200, WORLD_HEIGHT - 4); ctx.lineTo(256, WORLD_HEIGHT - 15);
            ctx.lineTo(256, WORLD_HEIGHT); ctx.lineTo(0, WORLD_HEIGHT);
            ctx.fill();
            ctx.stroke();

            // Target Object (Blinking Solid Crate)
            const ox = targetObject.x;
            const oy = targetObject.y;
            const s = targetObject.size;
            ctx.fillStyle = COLOR_NEON;
            if (!targetObject.isGrabbed && Math.floor(Date.now() / 200) % 2 === 0) {
                // Blink when on floor
                ctx.strokeRect(ox - s/2, oy - s/2, s, s);
            } else {
                ctx.fillRect(ox - s/2, oy - s/2, s, s);
            }

            // Gantry Base (Filled)
            const bx = cx;
            const by = boat.y;
            const bw = boat.width;
            
            ctx.fillStyle = COLOR_BG; // Mask the radar behind the solid gantry
            ctx.fillRect(bx - bw/2, by, bw, boat.height);
            ctx.strokeRect(bx - bw/2, by, bw, boat.height);

            // Trolley Carriage (Filled)
            const tx = trolley.x;
            const ty = trolley.y + boat.height;
            ctx.fillRect(tx - trolley.width/2, ty, trolley.width, trolley.height);
            ctx.strokeRect(tx - trolley.width/2, ty, trolley.width, trolley.height);

            // Winch Cable
            ctx.beginPath();
            ctx.moveTo(tx, ty + trolley.height);
            ctx.lineTo(crane.clawX, crane.clawY);
            ctx.stroke();

            // Claw (Filled Center)
            const clx = crane.clawX;
            const cly = crane.clawY;
            const spread = crane.isOpen ? 12 : 4;
            
            ctx.fillStyle = COLOR_NEON;
            ctx.fillRect(clx - 4, cly - 4, 8, 8); // Central Hub
            
            ctx.beginPath();
            // Left Arm
            ctx.moveTo(clx - 4, cly);
            ctx.lineTo(clx - spread - 2, cly + 10);
            ctx.lineTo(clx - spread + 2, cly + 18);
            // Right Arm
            ctx.moveTo(clx + 4, cly);
            ctx.lineTo(clx + spread + 2, cly + 10);
            ctx.lineTo(clx + spread - 2, cly + 18);
            ctx.stroke();

            ctx.restore(); // Undo camera pan

            if (!debugState.disableMask) {
                // --- DARKNESS & VISIBILITY MASK ---
                // Draw thick darkness covering the trench on the OFF-SCREEN canvas
                maskCtx.fillStyle = 'rgba(2, 10, 2, 0.98)';
                maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
                
                // Switch composite mode to 'erase' the darkness layer where light shines
                maskCtx.globalCompositeOperation = 'destination-out';
                
                // Light distance degrades as the 120s battery depletes
                const batteryRatio = Math.max(0.05, battery / BATTERY_MAX);
                const ambientRadius = debugState.ambient * batteryRatio;
                const coneRadius = debugState.length * batteryRatio;
                const coneAngle = (debugState.width * Math.PI) / 180; 
                
                // Calculate light source (claw) position in screen coordinates
                const screenClx = crane.clawX;
                const screenCly = crane.clawY - cameraY;
                
                // 1. Ambient localized glow around the claw
                let lightGrad = maskCtx.createRadialGradient(screenClx, screenCly, 0, screenClx, screenCly, ambientRadius);
                lightGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                lightGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                maskCtx.fillStyle = lightGrad;
                maskCtx.beginPath();
                maskCtx.arc(screenClx, screenCly, ambientRadius, 0, Math.PI * 2);
                maskCtx.fill();
                
                // 2. Directional Spotlight Cone
                // Base angle flips upwards if reeling the winch up
                const isGoingUp = keys.up;
                const baseAngle = isGoingUp ? -Math.PI / 2 : Math.PI / 2;
                
                lightGrad = maskCtx.createRadialGradient(screenClx, screenCly, 0, screenClx, screenCly, coneRadius);
                lightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                lightGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
                lightGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                maskCtx.fillStyle = lightGrad;
                maskCtx.beginPath();
                maskCtx.moveTo(screenClx, screenCly);
                maskCtx.arc(screenClx, screenCly, coneRadius, baseAngle - coneAngle/2, baseAngle + coneAngle/2);
                maskCtx.lineTo(screenClx, screenCly);
                maskCtx.fill();
                
                // Reset composite operation on the mask canvas for the next frame
                maskCtx.globalCompositeOperation = 'source-over';
                
                // Stamp the completed lighting mask over the main game canvas
                ctx.drawImage(maskCanvas, 0, 0);
            }

            // --- HUD (Drawn in screen space) ---
            ctx.fillStyle = COLOR_NEON;
            ctx.strokeStyle = COLOR_NEON;
            ctx.lineWidth = 1;
            
            // Top HUD Line 1
            ctx.font = 'bold 15px "Share Tech Mono", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`SALVAGE: ${score}`, 10, 16);
            
            ctx.textAlign = 'right';
            ctx.fillText(`CLAW: ${crane.isOpen ? 'IDLE' : 'LOCKED'}`, canvas.width - 10, 16);
            
            // Top HUD Line 2 (Depth)
            ctx.textAlign = 'center';
            ctx.fillText(`DEPTH: ${Math.floor(crane.clawY)}M`, canvas.width / 2, 32);

            // --- GAME OVER SCREEN ---
            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(2, 10, 2, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#FF4444';
                ctx.textAlign = 'center';
                ctx.font = 'bold 18px "Share Tech Mono", monospace';
                ctx.fillText("SYSTEM FAILURE", canvas.width/2, canvas.height/2 - 20);
                
                ctx.fillStyle = COLOR_NEON;
                ctx.font = '14px "Share Tech Mono", monospace';
                ctx.fillText("BATTERY DEPLETED", canvas.width/2, canvas.height/2);
                
                // Blinking restart prompt
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    ctx.fillText("TAP SCREEN TO RESTART", canvas.width/2, canvas.height/2 + 30);
                }
            }
        }

        function gameLoop(timestamp) {
            // Keep looping even on game over to render blinking text
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            if (gameState === 'PLAYING') {
                update(dt);
            }
            
            draw();

            requestAnimationFrame(gameLoop);
        }
        
        draw();

    </script>
</body>
</html>
